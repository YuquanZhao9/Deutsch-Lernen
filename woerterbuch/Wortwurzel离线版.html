 → 和气","fam":["verbinden","Verbindung","binden","unverbindlich","Verbindlichkeit"],"ety":"派生自 verbinden；binden < 古高地德语 bintan。","cog":"英 bind（与 binden 同源）","tip":"日常最常见的是“有约束力”义；“和气”义偏书面。Verbindlichkeiten（复数）在经济德语中义为“负债”，常与 Forderungen（应收债权）相对。"},{"w":"Verbindlichkeit","pos":"n","gen":"f","pl":"Verbindlichkeiten","gs":"der Verbindlichkeit","ipa":"fɛɐ̯ˈbɪntlɪçkaɪ̯t","lvl":"C1","senses":[{"zh":"约束力，有效性","de":"das Verbindlichsein, bindende Wirkung","ex":[{"de":"Die Empfehlung hat keine rechtliche Verbindlichkeit.","zh":"该建议不具法律约束力。"}]},{"zh":"（复数）债务，负债","de":"Schulden, finanzielle Verpflichtungen (Pl.)","ex":[{"de":"Das Unternehmen konnte seine Verbindlichkeiten nicht mehr begleichen.","zh":"该公司已无力偿还债务。"}]},{"zh":"（态度）周到，客气，亲切","de":"Freundlichkeit, Entgegenkommen","ex":[{"de":"Er empfing die Gäste mit großer Verbindlichkeit.","zh":"他十分周到地接待了客人。"}]}],"use":["Verbindlichkeiten gegenüber jdm. — 对某人的债务","Verbindlichkeiten begleichen / tilgen — 清偿债务","rechtliche Verbindlichkeit — 法律约束力"],"root":"ver·bind·lich·keit：verbinden（连接、约束）+ -lich（形容词后缀）+ -keit（名词后缀）→“有约束性的状态” → 约束力；债务；（待人）周到","fam":["verbindlich","verbinden","Verbindung","binden","unverbindlich"],"ety":"verbindlich 由 verbinden（使承担义务）派生；binden < 古高地德语 bintan。","cog":"英 bind","tip":"会计中 Verbindlichkeiten = 负债（对应 Forderungen 应收款）。unverbindlich 意为“无约束力的”，如 ein unverbindliches Angebot（不具约束力的报价）。"},{"w":"verbreiten","pos":"v","ipa":"fɛɐ̯ˈbʁaɪ̯tn̩","lvl":"B2","forms":"verbreitet · verbreitete · hat verbreitet","sep":false,"senses":[{"zh":"传播，散布（消息、谣言、观点等）","de":"etw. (Nachrichten, Gerüchte, Ideen) unter vielen Menschen bekannt machen","ex":[{"de":"Die Falschmeldung wurde innerhalb weniger Stunden über soziale Netzwerke verbreitet.","zh":"这条假新闻在几个小时内就通过社交网络传播开来。"}]},{"zh":"（反身）扩散，蔓延；（气味等）弥漫","de":"sich ausbreiten (Krankheit, Geruch, Stimmung)","ex":[{"de":"Das Virus hat sich rasch in der ganzen Region verbreitet.","zh":"病毒迅速在整个地区扩散。"}]},{"zh":"散发，营造（某种气氛、情绪）","de":"eine Stimmung, ein Gefühl um sich herum entstehen lassen", "许多人回避气候变化这个话题，因为它让他们感到害怕。"}]}],"use":["jdn. / etw. aus etw.(D) verdrängen — 把某人/某物从……中排挤出去","jdn. vom ersten Platz verdrängen — 把某人挤下第一名","Probleme / Erinnerungen verdrängen — 压抑问题/回忆"],"root":"ver·dräng·en：ver-（离开、去除）+ drängen（推挤）→ “挤开” → 排挤、取代；心理学上引申为把念头“挤出”意识 → 压抑","fam":["drängen","Verdrängung","Gedränge","Drang","aufdrängen"],"ety":"drängen < 中古高地德语 drengen < 古高地德语 drengen，为 dringen（挤进、穿透）的使役动词。","cog":"荷 dringen；英 throng（人群，与 dringen 同源）","tip":"心理学术语 Verdrängung = 弗洛伊德的“压抑”（英 repression）。日常口语中 „Das habe ich total verdrängt.“ 常表示“我完全忘了（不愿想起）这件事”。"},{"w":"vereinbaren","pos":"v","ipa":"fɛɐ̯ˈʔaɪ̯nbaːʁən","lvl":"B1","forms":"vereinbart · vereinbarte · hat vereinbart","sep":false,"senses":[{"zh":"约定，商定（时间、条件等）","de":"etw. miteinander absprechen, festlegen","ex":[{"de":"Bitte vereinbaren Sie telefonisch einen Termin.","zh":"请电话预约时间。"},{"de":"Die beiden Seiten vereinbarten einen Waffenstillstand.","zh":"双方商定停火。"}]},{"zh":"（etw. mit etw. vereinbaren）使协调，使相容","de":"in Einklang bringen","ex":[{"de":"Viele Eltern finden es schwer, Beruf und Familie zu vereinbaren.","zh":"许多父母觉得很难兼顾工作与家庭。"},{"de":"Das ist mit meinem Gewissen nicht vereinbar.","zh":"这与我的良心相悖。"}]}],"use":["einen Termin / ein Treffen vereinbaren — 约定时间/会面","wie vereinbart — 按照约定","etw. mit etw. vereinbaren — 使某事与某事协调","mit etw. (nicht) vereinbar sein — 与……（不）相容","die Vereinbarung — 协议；die Vereinbarkeit von Familie und Beruf 家庭与工作的兼顾"],"root":"ver·ein·bar·en：ver- + einbar（中古德语“一致的”，由 ein“一”构成）→“使一致” → 商定；使相容","fam":["Vereinbarung","vereinbar","Vereinbarkeit","einig","vereinen"],"ety":"一般认为源自中古高地德语 einbæren（使一致），与 ein（一）有关；具体构词过程说法不一。","cog":"ein：英 one","tip":"不可分：vereinbart（不加 ge-）。“预约”常说 einen Termin vereinbaren / ausmachen，不说 *einen Termin bestellen。"},{"w":"Verfahren","pos":"n","gen":"n","pl":"Verfahren","gs":"des Verfahrens","ipa":"fɛɐ̯ˈfaːʁən","lvl":"C1","senses":[{"zh":"方法，工艺，技术","de":"Methode, technisches Vorgehen","ex":[{"de":"Mit einem neuen Verfahren lässt sich der Stahl günstiger herstellen.","zh":"采用新工艺可以更低成本地生产钢材。"}]},{"zh":"（法律/行政）程序，诉讼","de":"Rechtsverfahren, Prozess; amtlicher Ablauf","ex":[{"de":"Gegen den Politiker wurde ein Verfahren wegen Bestechung eingeleitet.","zh":"已对这名政客启动受贿调查程序。"},{"de":"Das Verfahren wurde eingestellt.","zh":"该程序/诉讼已被终止。"}]}],"use":["ein Verfahren gegen jdn. einleiten / einstellen — 对某人启动/终止（司法）程序","ein Verfahren anwenden / entwickeln — 采用/开发一种方法","Asylverfahren, Auswahlverfahren — 庇护程序、选拔程序"],"root":"ver·fahr·en：动词 verfahren（处理、行事）的不定式名词化 →“行事的方式” → 方法、程序","fam":["verfahren","fahren","Erfahrung","Verfahrensweise","Fahrt"],"ety":"名词化的动词不定式；verfahren（行事、处理）< 中古高地德语 vervarn；fahren < 古高地德语 faran（行、走）。","cog":"英 fare（同源：farewell, welfare）","tip":"动词 verfahren 有“处理（mit jdm./etw. verfahren）”与反身“迷路（sich verfahren）”两义。名词复数与单数同形：die Verfahren。"},{"w":"verfassen","pos":"v","ipa":"fɛɐ̯ˈfasn̩","lvl":"B2","forms":"verfasst · verfasste · hat verfasst","sep":false,"senses":[{"zh":"撰写，起草（文章、书信、文件等）","de":"einen Text (schriftlich) formulieren und abfassen","ex":[{"de":"Sie hat ihre Masterarbeit auf Englisch verfasst.","zh":"她用英语撰写了硕士论文。"},{"de":"Der Brief wurde von einem anonymen Absender verfasst.","zh":"这封信出自一位匿名寄信人之手。"}]}],"use":["einen Bericht / Artikel / Brief verfassen — 撰写报告/文章/信件","eine Stellungnahme verfassen — 起草一份声明","der Verfasser / die Verfasserin — 作者，撰写人"],"root":"ver·fass·en：ver-（完成）+ fassen（抓住，把……装进形式）→ “把思想纳入文字形式” → 撰写","fam":["fassen","Verfasser","Verfassung","abfassen","Fassung"],"ety":"fassen < 中古高地德语 vazzen < 古高地德语 fazzōn（装入、抓取），与 Fass（桶）同源。","cog":"英 vat（大桶，与 Fass 同源）；荷 vatten","tip":"verfassen 比 schreiben 更正式，多用于书面成品（报告、声明、诗歌）。名词 Verfassung 除“撰写”外主要义为“宪法”和“（身心）状态”：in guter Verfassung sein。"},{"w":"verfolgen","pos":"v","ipa":"fɛɐ̯ˈfɔlɡn̩","lvl":"B2","forms":"verfolgt · verfolgte · hat verfolgt","sep":false,"senses":[{"zh":"追赶，跟踪","de":"hinter jdm./etw. herlaufen oder -fahren, um ihn/es zu fassen","ex":[{"de":"Die Polizei verfolgte den Fluchtwagen bis zur Grenze.","zh":"警方一路追击逃逸车辆直到边境。"}]},{"zh":"关注，密切留意（事态发展）","de":"die Entwicklung von etw. aufmerksam beobachten","ex":[{"de":"Wir verfolgen die Lage in der Region mit großer Sorge.","zh":"我们非常担忧地关注着该地区的局势。"}]},{"zh":"追求（目标）；推行（政策、策略）","de":"ein Ziel, eine Absicht, eine Strategie zu verwirklichen suchen","ex":[{"de":"Die Regierung verfolgt eine restriktive Finanzpolitik.","zh":"政府推行紧缩性的财政政策。"}]},{"zh":"迫害；（法律）追究，起诉","de":"jdn. bedrängen, unterdrücken; strafrechtlich gegen jdn. vorgehen","ex":[{"de":"Im Nationalsozialismus wurden Millionen Menschen aus politischen und rassistischen Gründen verfolgt.","zh":"纳粹时期，数百万人因政治和种族原因遭到迫害。"}]}],"use":["ein Ziel / eine Strategie verfolgen — 追求目标/奉行策略","etw. aufmerksam / gespannt verfolgen — 密切/紧张地关注某事","strafrechtlich verfolgt werden — 被追究刑事责任","politisch Verfolgte genießen Asylrecht — 受政治迫害者享有庇护权（《基本法》第16a条）"],"root":"ver·folg·en：ver-（加强、持续）+ folgen（跟随）→ “紧紧跟在后面” → 追赶；引申为关注、追求、迫害","fam":["folgen","Verfolgung","Verfolger","Folge","befolgen"],"ety":"folgen < 中古高地德语 volgen < 古高地德语 folgēn。","cog":"英 follow；荷 volgen","tip":"注意 folgen 支配第三格（jdm. folgen），而 verfolgen 支配第四格（jdn. verfolgen）。“关注新闻/比赛”可直接说 die Nachrichten / das Spiel verfolgen。"},{"w":"verfügen","pos":"v","ipa":"fɛɐ̯ˈfyːɡn̩","lvl":"B2","forms":"verfügt · verfügte · hat verfügt","sep":false,"senses":[{"zh":"（über etw. verfügen）拥有，具备；可支配","de":"etw. besitzen, haben; über etw. bestimmen können","ex":[{"de":"Die Bewerberin verfügt über langjährige Berufserfahrung.","zh":"这位女应聘者拥有多年工作经验。"},{"de":"Jedes Zimmer verfügt über ein eigenes Bad.","zh":"每个房间都配有独立浴室。"}]},{"zh":"（官方）命令，规定","de":"amtlich anordnen","ex":[{"de":"Das Gericht verfügte die Schließung des Betriebs.","zh":"法院下令关闭该企业。"}]}],"use":["über etw.(A) verfügen — 拥有某物；支配某物","jdm. zur Verfügung stehen — 供某人使用","jdm. etw. zur Verfügung stellen — 向某人提供某物","verfügbar — 可用的，有货的"],"root":"ver·füg·en：ver- + fügen（安排、组合）→“作出安排” → 规定、支配 → 拥有（可支配的东西）","fam":["Verfügung","verfügbar","fügen","Gefüge","hinzufügen"],"ety":"fügen < 中古高地德语 vüegen < 古高地德语 fuogen（使合适、组合）。","cog":"荷 voegen（接合）","tip":"„über etw. verfügen“ 比 haben 正式得多，常见于简历、房屋/产品介绍。介词 über 后接第四格。"},{"w":"sich vergewissern","pos":"v","ipa":"fɛɐ̯ɡəˈvɪsɐn","lvl":"C1","forms":"vergewissert sich · vergewisserte sich · hat sich vergewissert","sep":false,"senses":[{"zh":"确认，弄清楚，核实","de":"sich Gewissheit verschaffen, nachprüfen","ex":[{"de":"Vergewissern Sie sich vor der Abfahrt, dass alle Fenster geschlossen sind.","zh":"出发前请确认所有窗户都已关好。"},{"de":"Sie vergewisserte sich noch einmal, ob die Tür abgeschlossen war.","zh":"她又确认了一遍门是否锁好。"}]}],"use":["sich einer Sache (G) vergewissern — 确认某事（书面，第二格）","sich vergewissern, dass / ob … — 确认……","sich bei jdm. vergewissern — 向某人核实"],"root":"ver·ge·wiss·er·n：ver-（使）+ gewiss（确定的）+ -ern → “使自己确定” → 确认","fam":["gewiss","Gewissheit","Gewissen","wissen"],"ety":"由 gewiss 派生；gewiss < 中古高地德语 gewis < 古高地德语 giwis，与 wissen 同族。","cog":"wissen：英 wit, wise","tip":"必须带反身代词 sich（第四格）；名词宾语用第二格：sich der Richtigkeit vergewissern。"},{"w":"vergleichen","pos":"v","ipa":"fɛɐ̯ˈɡlaɪ̯çn̩","lvl":"B1","forms":"vergleicht · verglich · hat verglichen","sep":false,"senses":[{"zh":"比较，对比","de":"Gemeinsamkeiten und Unterschiede feststellen","ex":[{"de":"Bevor man einen Vertrag abschließt, sollte man die Angebote sorgfältig vergleichen.","zh":"签合同之前，应该仔细比较各家报价。"}]},{"zh":"把……比作……","de":"jdn./etw. als ähnlich mit jdm./etw. darstellen","ex":[{"de":"Der Autor vergleicht die Stadt mit einem Labyrinth.","zh":"作者把这座城市比作迷宫。"}]},{"zh":"（反身，法律）和解，达成和解","de":"sich (vor Gericht) gütlich einigen","ex":[{"de":"Die Parteien haben sich außergerichtlich verglichen.","zh":"双方已庭外和解。"}]}],"use":["etw. mit etw.(D) vergleichen — 将某物与某物比较","im Vergleich zu / mit etw. — 与……相比","Das ist nicht zu vergleichen. — 这没法比。","sich mit jdm. vergleichen — 和某人攀比/比较"],"root":"ver·gleich·en：ver-（使成为）+ gleich（相同的）→ “看看是否相同” → 比较","fam":["gleich","Vergleich","vergleichbar","ausgleichen","vergleichsweise"],"ety":"mhd. verglīchen；gleich < 中古高地德语 gelīch < 古高地德语 gilīh（ge- + līh“形体、身体”）。","cog":"英 like, alike；荷 gelijk","tip":"强变化：verglich – verglichen，不要误作 *vergleichte。Vergleich 作法律术语指“和解（协议）”：einen Vergleich schließen。"},{"w":"vergleichsweise","pos":"adv","ipa":"fɛɐ̯ˈɡlaɪ̯çsvaɪ̯zə","lvl":"C1","senses":[{"zh":"相对地，比较而言","de":"im Vergleich (zu anderem), relativ","ex":[{"de":"Die Mieten sind hier vergleichsweise niedrig.","zh":"这里的房租相对较低。"},{"de":"Der Schaden war vergleichsweise gering.","zh":"损失相对较小。"}]}],"use":["vergleichsweise + Adj. — 相对……（vergleichsweise teuer / gering / hoch）","也可作定语（较少见）：ein vergleichsweise geringer Aufwand — 相对较小的投入","近义：relativ, verhältnismäßig"],"root":"vergleich·s·weise：Vergleich（比较）+ -s-（连接音）+ -weise（以……方式，副词后缀）→“通过比较来看”","fam":["Vergleich","vergleichen","gleich","beispielsweise","teilweise"],"ety":"由 Vergleich + 副词后缀 -weise 构成；gleich < 古高地德语 gilīh；-weise 来自 Weise（方式）。","cog":"英 like（与 gleich 同源）；英 -wise（如 otherwise，与 Weise 同源）","tip":"-weise 构成的副词原则上只作状语；作定语修饰名词（*ein vergleichsweiser Erfolg）被视为不规范，应改说 ein vergleichsweise großer Erfolg。"},{"w":"verhindern","pos":"v","ipa":"fɛɐ̯ˈhɪndɐn","lvl":"B1","forms":"verhindert · verhinderte · hat verhindert","sep":false,"senses":[{"zh":"阻止，防止","de":"bewirken, dass etw. nicht geschieht","ex":[{"de":"Die Feuerwehr konnte ein Übergreifen der Flammen verhindern.","zh":"消防队阻止了火势蔓延。"},{"de":"Wie lässt sich verhindern, dass so etwas wieder passiert?","zh":"如何防止此类事情再次发生？"}]},{"zh":"verhindert sein：（因故）不能出席","de":"wegen anderer Verpflichtungen nicht kommen können","ex":[{"de":"Herr Bauer ist heute leider verhindert.","zh":"鲍尔先生今天很遗憾有事不能来。"}]}],"use":["etw. verhindern — 阻止某事","verhindern, dass … — 防止……（dass 从句中不加否定词）","die Verhinderung — 阻止"],"root":"ver·hinder·n：ver-（加强、彻底）+ hindern（阻碍）→“彻底阻碍” → 阻止","fam":["hindern","Hindernis","behindern","Behinderung"],"ety":"hindern < 中古高地德语 hindern < 古高地德语 hintaren，与 hinter（在后面）有关，原义“使退后、阻挡”。","cog":"英 hinder","tip":"中国学生常错：verhindern, dass es nicht regnet 是错误的，dass 从句中不再加 nicht。behindern 只是“妨碍”，verhindern 是“使不发生”。"},{"w":"Verhältnis","pos":"n","gen":"n","pl":"Verhältnisse","gs":"des Verhältnisses","ipa":"fɛɐ̯ˈhɛltnɪs","lvl":"B2","senses":[{"zh":"关系（人与人之间）","de":"Beziehung zwischen Personen","ex":[{"de":"Sie hat ein gutes Verhältnis zu ihren Kollegen.","zh":"她和同事关系很好。"}]},{"zh":"比例，比率；对比","de":"Proportion, Relation","ex":[{"de":"Das Verhältnis von Kosten und Nutzen stimmt nicht.","zh":"成本与收益不成比例。"}]},{"zh":"（复数）状况，境况","de":"Lebensumstände, Lage (Pl.)","ex":[{"de":"Sie wuchs in einfachen Verhältnissen auf.","zh":"她在清贫的环境中长大。"}]},{"zh":"（婚外）情人关系","de":"Liebesbeziehung, Affäre","ex":[{"de":"Er hatte ein Verhältnis mit seiner Sekretärin.","zh":"他和秘书有私情。"}]}],"use":["ein gutes Verhältnis zu jdm. haben — 与某人关系好","im Verhältnis zu etw.(D) — 与……相比","über seine Verhältnisse leben — 入不敷出、过度消费","in geordneten Verhältnissen — 生活安定"],"root":"ver·hält·nis：verhalten（表现、相处）+ -nis（名词后缀）→“事物之间如何相互对待” → 关系、比例","fam":["verhältnismäßig","verhalten","Verhalten","halten","Missverhältnis"],"ety":"由 verhalten（sich verhalten 相处、表现）派生，-nis 为中性/阴性名词后缀；halten < 古高地德语 haltan。","cog":"英 hold（halten）","tip":"“与某人的关系”用 Verhältnis zu jdm.（不用 mit）；verhältnismäßig = 相对地。Verhältnis 也可指“婚外恋”，用于人际时注意语境。"},{"w":"verhältnismäßig","pos":"adj","ipa":"fɛɐ̯ˈhɛltnɪsmɛːsɪç","lvl":"C1","forms":"—","senses":[{"zh":"（副词）相对地，比较地","de":"relativ, im Verhältnis zu etw.","ex":[{"de":"Die Prüfung war verhältnismäßig leicht.","zh":"考试相对容易。"}]},{"zh":"（法律）合乎比例的，适度的","de":"angemessen, dem Zweck entsprechend (Recht)","ex":[{"de":"Das Gericht hielt die Maßnahme nicht für verhältnismäßig.","zh":"法院认为该措施不合比例（过度）。"}]}],"use":["verhältnismäßig + Adj. — 相对……","Grundsatz der Verhältnismäßigkeit — 比例原则（法律）","Gegenteil: unverhältnismäßig — 过度的，不成比例的（unverhältnismäßig hohe Kosten）"],"root":"verhältnis·mäßig：Verhältnis（比例，关系）+ -mäßig（“按……的、合乎……的”）→“按比例的”","fam":["Verhältnis","verhalten","Verhältnismäßigkeit","unverhältnismäßig","Maß"],"ety":"由 Verhältnis + -mäßig 构成；-mäßig 来自 Maß（尺度），与 messen 同族。","cog":"英 hold（与 halten 同源）；英 mete（out）（与 messen 同源）","tip":"日常主要用作副词“相对地”，与 relativ 同义；法律语境中 verhältnismäßig / Verhältnismäßigkeit 是核心术语（比例原则）。比较级罕见。"},{"w":"verknüpfen","pos":"v","ipa":"fɛɐ̯ˈknʏp͡fn̩","lvl":"C1","forms":"verknüpft · verknüpfte · hat verknüpft","sep":false,"senses":[{"zh":"（把绳、线等）系在一起，打结连接","de":"durch Knoten miteinander verbinden","ex":[{"de":"Die beiden Seilenden werden fest miteinander verknüpft.","zh":"两条绳子的末端被牢牢地系在一起。"}]},{"zh":"把……联系起来，关联；附带（条件）","de":"in einen Zusammenhang bringen; etw. von etw. abhängig machen","ex":[{"de":"Die Hilfszahlungen sind mit strengen Auflagen verknüpft.","zh":"这些援助款项附带严格的条件。"},{"de":"Mit dem Umzug sind für sie viele Erinnerungen verknüpft.","zh":"这次搬家对她来说牵连着许多回忆。"}]}],"use":["etw. mit etw.(D) verknüpfen — 把某事与某事联系起来","etw. mit einer Bedingung verknüpfen / an eine Bedingung knüpfen — 把某事与某条件挂钩","eng miteinander verknüpft sein — 彼此紧密相关","Daten verknüpfen — 关联数据（IT）"],"root":"ver·knüpf·en：ver-（使结合）+ knüpfen（打结、编结）→ “打结连在一起” → 关联","fam":["knüpfen","Verknüpfung","anknüpfen","Knopf","Knoten"],"ety":"knüpfen < 中古高地德语 knüpfen < 古高地德语 knupfen，由 Knopf（结、扣）派生。","cog":"荷 knopen（打结）；英 knob、knop 可能为远亲（一说）","tip":"“把条件附加于……”常说 Bedingungen an etw.(A) knüpfen；verknüpfen 一般接 mit。在电脑上“快捷方式”叫 Verknüpfung。"},{"w":"verlangen","pos":"v","ipa":"fɛɐ̯ˈlaŋən","lvl":"B1","forms":"verlangt · verlangte · hat verlangt","sep":false,"senses":[{"zh":"要求，索要","de":"fordern, haben wollen","ex":[{"de":"Die Gewerkschaft verlangt acht Prozent mehr Lohn.","zh":"工会要求加薪百分之八。"},{"de":"Das ist zu viel verlangt.","zh":"这要求太过分了。"}]},{"zh":"需要（某种能力等）","de":"erfordern","ex":[{"de":"Die Stelle verlangt viel Flexibilität.","zh":"这个职位需要很强的灵活性。"}]},{"zh":"（nach etw./jdm. verlangen）渴望；要求见（某人）","de":"sich nach etw. sehnen; jdn. sprechen wollen","ex":[{"de":"Der Patient verlangte nach einem Arzt.","zh":"病人要求见医生。"}]}],"use":["etw. von jdm. verlangen — 向某人要求某事","nach etw.(D) / jdm. verlangen — 渴望/要求见","Sie werden am Telefon verlangt. — 有您的电话。","das Verlangen (nach etw.) — 渴望"],"root":"ver·lang·en：ver- + langen（伸手去够；lang 长）→“伸手要” → 要求；渴望","fam":["langen","lang","Verlangen","belangen","anlangen"],"ety":"中古高地德语 verlangen，由 损害）+ letzen（旧词：阻碍、伤害）→ 伤害；抽象引申为违反","fam":["Verletzung","verletzlich","unverletzt","Verletzte"],"ety":"mhd. verletzen < letzen（阻碍、伤害），古高地德语 lezzen；一般认为由 laz（懒散、迟缓，即今 lass）派生，原义“使迟缓、阻碍”。","cog":"英 late, let（古义“阻碍”，如 without let or hindrance）；一说同源","tip":"“受伤的人”= der/die Verletzte（形容词名词化）。“伤了某人的心”用 jdn. verletzen 或 jds. Gefühle verletzen，不要直译“伤心”。"},{"w":"verlässlich","pos":"adj","ipa":"fɛɐ̯ˈlɛslɪç","lvl":"B2","forms":"verlässlicher · am verlässlichsten","senses":[{"zh":"可靠的，值得信赖的","de":"so, dass man sich darauf verlassen kann","ex":[{"de":"Wir brauchen verlässliche Daten, bevor wir entscheiden.","zh":"做决定之前我们需要可靠的数据。"},{"de":"Sie ist eine verlässliche Partnerin.","zh":"她是位可靠的合作伙伴。"}]}],"use":["eine verlässliche Quelle / Information — 可靠的来源 / 信息","动词：sich auf jdn./etw.(A) verlassen — 依靠、信赖某人/某事","Auf ihn ist Verlass. — 他靠得住。"],"root":"ver·läss·lich：(sich) verlassen（依靠）+ -lich（“可……的”）→“可以依靠的”","fam":["sich verlassen","Verlass","zuverlässig","Verlässlichkeit"],"ety":"派生自 (sich) verlassen；lassen < 古高地德语 lāzan。","cog":"英 let（与 lassen 同源）","tip":"verlässlich 与 zuverlässig 基本同义；zuverlässig 更常见，verlässlich 稍书面，常用于 Daten / Quelle / Partner。"},{"w":"vermeiden","pos":"v","ipa":"fɛɐ̯ˈmaɪ̯dn̩","lvl":"B1","forms":"vermeidet · vermied · hat vermieden","sep":false,"senses":[{"zh":"避免","de":"etw. nicht tun, dafür sorgen, dass etw. nicht geschieht","ex":[{"de":"Fehler dieser Art lassen sich leicht vermeiden.","zh":"这类错误很容易避免。"},{"de":"Er vermied es, ihr in die Augen zu sehen.","zh":"他回避与她对视。"}]}],"use":["etw. vermeiden — 避免某事","es vermeiden, etw. zu tun — 避免做某事","vermeidbar / unvermeidlich — 可避免的/不可避免的"],"root":"ver·meid·en：ver- + meiden（避开）→ 避免","fam":["meiden","unvermeidlich","Vermeidung"],"ety":"meiden < 中古高地德语 mīden < 古高地德语 mīdan（避开）< 原始日耳曼语 *mīþaną。","cog":"古英语 mīþan（隐藏，避开）","tip":"强变化：vermied, vermieden，不要写成 *vermeidete；与 vermieten（出租）的过去分词 vermietet 不同。"},{"w":"vermitteln","pos":"v","ipa":"fɛɐ̯ˈmɪtl̩n","lvl":"B2","forms":"vermittelt · vermittelte · hat vermittelt","sep":false,"senses":[{"zh":"传授，传达（知识、价值观、印象）","de":"(Wissen, Werte, einen Eindruck) weitergeben, übermitteln","ex":[{"de":"Lehrer sollen nicht nur Wissen, sondern auch Werte vermitteln.","zh":"教师不仅要传授知识，还要传递价值观。"},{"de":"Das Foto vermittelt einen falschen Eindruck.","zh":"这张照片给人造成了错误的印象。"}]},{"zh":"调解，斡旋","de":"zwischen Parteien schlichten","ex":[{"de":"Norwegen hat zwischen den Konfliktparteien vermittelt.","zh":"挪威在冲突各方之间进行了斡旋。"}]},{"zh":"介绍，促成（工作、住房、联系等）","de":"jdm. etw. (eine Stelle, eine Wohnung, einen Kontakt) verschaffen","ex":[{"de":"Die Agentur hat ihm eine Stelle in München vermittelt.","zh":"中介给他介绍了一份在慕尼黑的工作。"}]}],"use":["jdm. etw. vermitteln — 向某人传授/介绍某事","zwischen A und B vermitteln — 在A与B之间调解","der Vermittler, die Vermittlung — 调解人、中介；调解、介绍","die Wissensvermittlung — 知识传授"],"root":"ver·mittel·n：ver- + mittel / Mitte（中间）→“处于中间” → 居间调解；在中间传递 → 传达、介绍","fam":["Mitte","Vermittlung","Vermittler","vermittelbar","ermitteln"],"ety":"由 mittel（中间的）派生；Mitte < 古高地德语 mitti < 原始日耳曼语 *midja-。","cog":"英 mid, middle","tip":"„Wissen vermitteln“ 是“传授知识”的地道说法，不说 *Wissen lehren。"},{"w":"vermutlich","pos":"adv","ipa":"fɛɐ̯ˈmuːtlɪç","lvl":"B1","senses":[{"zh":"大概，可能，据推测","de":"wahrscheinlich, wie man vermutet","ex":[{"de":"Der Zug hat vermutlich Verspätung.","zh":"火车大概晚点了。"},{"de":"Die Ursache war vermutlich ein technischer Defekt.","zh":"原因据推测是技术故障。"}]},{"zh":"（作定语形容词）推测的，被怀疑的","de":"angenommen, mutmaßlich","ex":[{"de":"Der vermutliche Täter wurde festgenommen.","zh":"嫌疑人已被逮捕。"}]}],"use":["作句子副词，可位于第一位或中场：Vermutlich kommt er später. / Er kommt vermutlich später.","近义：wahrscheinlich（更常用）；mutmaßlich（新闻、法律用语：der mutmaßliche Täter）"],"root":"ver·mut·lich：vermuten（推测）+ -lich →“据推测的”","fam":["vermuten","Vermutung","Mut","Gemüt","mutmaßlich"],"ety":"派生自 vermuten；vermuten 与 Mut（古义“心思、心意”）同族。Mut < 古高地德语 muot。","cog":"英 mood（与 Mut 同源）","tip":"vermutlich 表达说话人的推测，比 wahrscheinlich 略书面；新闻报道中嫌疑人更常用 mutmaßlich。"},{"w":"Vermögen","pos":"n","gen":"n","pl":"Vermögen","gs":"des Vermögens","ipa":"fɛɐ̯ˈmøːɡn̩","lvl":"B2","senses":[{"zh":"财产，资产","de":"Gesamtheit des Besitzes, Geld und Werte","ex":[{"de":"Er hat sein Vermögen mit Immobilien gemacht.","zh":"他靠房地产发了财。"},{"de":"Das Vermögen ist in Deutschland sehr ungleich verteilt.","zh":"德国的财富分配极不均衡。"}]},{"zh":"（书面）能力，本领","de":"Fähigkeit, Kraft, etw. zu tun","ex":[{"de":"Das übersteigt mein Vermögen.","zh":"这超出了我的能力。"}]}],"use":["ein Vermögen kosten / verdienen — 花/赚一大笔钱（口语夸张）","nach bestem Vermögen — 尽力","Vermögen verwalten / anlegen — 管理/投资资产","Vorstellungsvermögen, Durchhaltevermögen — 想象力、毅力"],"root":"ver·mög·en：动词 vermögen（能够，ver- + mögen“能”）的不定式名词化 →“所能支配的东西” → 能力；（可支配的）财产","fam":["vermögen","vermögend","mögen","möglich","Vorstellungsvermögen"],"ety":"名词化的动词不定式。动词 vermögen（能够做到；书面：Er vermag es nicht 他做不到）< 中古高地德语 vermügen；mögen < 古高地德语 mugan（能够）。“能力”是原义，“财产”由“能力、可支配的力量”引申而来。","cog":"英 may, might（mögen）","tip":"作名词复数与单数同形（die Vermögen），但复数少用。动词 vermögen 是书面语，变位同 mögen：vermag · vermochte · hat vermocht。合成词 -vermögen 常指“……能力”（Sehvermögen 视力）。"},{"w":"vernachlässigen","pos":"v","ipa":"fɛɐ̯ˈnaːxlɛsɪɡn̩","lvl":"C1","forms":"vernachlässigt · vernachlässigte · hat vernachlässigt","sep":false,"senses":[{"zh":"忽视，疏于照料（人、事物、职责）","de":"sich nicht genügend um jdn./etw. kümmern","ex":[{"de":"Über die Arbeit hat er seine Familie jahrelang vernachlässigt.","zh":"因为工作，他多年来疏忽了家庭。"},{"de":"Das Gebäude wurde jahrzehntelang vernachlässigt und ist nun baufällig.","zh":"这栋建筑几十年无人维护，如今已破败不堪。"}]},{"zh":"（学术、数学）忽略不计","de":"bei einer Betrachtung, Berechnung unberücksichtigt lassen","ex":[{"de":"Der Luftwiderstand kann in diesem Modell vernachlässigt werden.","zh":"在该模型中，空气阻力可以忽略不计。"}]}],"use":["seine Pflichten / Kinder vernachlässigen — 失职/疏于照顾孩子","zu vernachlässigen sein — 可以忽略不计","eine vernachlässigbare Größe — 可忽略的量"],"root":"ver·nach·läss·ig·en：ver- + nachlässig（疏忽的，来自 nachlassen“松懈”）+ -en → “对……疏忽” → 忽视","fam":["nachlässig","nachlassen","Vernachlässigung","vernachlässigbar","lassen"],"ety":"由形容词 nachlässig 派生；lassen < 中古高地德语 lāzen < 古高地德语 lāzan。","cog":"英 let（与 lassen 同源）；荷 laten","tip":"重音在 -nach-：fɛɐ̯ˈnaːx…，不在 ver-。四格宾语直接跟：jdn./etw. vernachlässigen（不用介词）。"},{"w":"Vernunft","pos":"n","gen":"f","pl":"—","gs":"der Vernunft","ipa":"fɛɐ̯ˈnʊnft","lvl":"B2","senses":[{"zh":"理智，理性；明智","de":"Fähigkeit, logisch und besonnen zu denken und zu handeln","ex":[{"de":"Nimm doch Vernunft an!","zh":"你理智点吧！"},{"de":"Kant unterscheidet zwischen theoretischer und praktischer Vernunft.","zh":"康德区分了理论理性与实践理性。"}]}],"use":["zur Vernunft kommen — 恢复理智、醒悟","jdn. zur Vernunft bringen — 使某人醒悟","Vernunft annehmen — 变得理智、听劝","gegen jede Vernunft — 完全违背常理"],"root":"ver·nunft：与 vernehmen（察觉、听取）相关，-t 为古老名词后缀 →“领会、理解的能力” → 理性","fam":["vernünftig","unvernünftig","vernehmen","nehmen","Vernunftehe"],"ety":"中古高地德语 vernunft < 古高地德语 firnunft，属 firneman（理解、察觉，今 vernehmen）的名词。","cog":"—","tip":"vernünftig 口语中常意为“像样的、正经的”：Ich brauche endlich ein vernünftiges Essen.（我终于需要吃顿像样的饭）。哲学中 Vernunft（理性）与 Verstand（知性）是不同概念。"},{"w":"vernünftig","pos":"adj","ipa":"fɛɐ̯ˈnʏnftɪç","lvl":"B1","forms":"vernünftiger · am vernünftigsten","senses":[{"zh":"理智的，明白事理的，懂事的","de":"mit Vernunft handelnd, besonnen","ex":[{"de":"Sei doch vernünftig und geh zum Arzt!","zh":"理智点，去看医生吧！"}]},{"zh":"合理的，明智的","de":"sinnvoll, einleuchtend","ex":[{"de":"Das ist ein vernünftiger Vorschlag.","zh":"这是个合理的建议。"}]},{"zh":"（口语）像样的，正经的，够格的","de":"(ugs.) ordentlich, richtig, wie es sein soll","ex":[{"de":"Ich brauche jetzt endlich mal ein vernünftiges Essen.","zh":"我现在总算得吃顿像样的饭了。"}]}],"use":["vernünftig sein / handeln / reden — 理智 / 理智行事 / 讲道理","mit jdm. vernünftig reden können — 能和某人讲道理","ein vernünftiger Preis — 合理的价格","Gegenteil: unvernünftig — 不理智的"],"root":"vernünft·ig：Vernunft（理性）+ -ig（形容词后缀）→“有理性的”","fam":["Vernunft","unvernünftig","vernehmen","nehmen"],"ety":"派生自 Vernunft；Vernunft < 古高地德语 firnumft / firnunft，是动词 vernehmen（领会、听取）的抽象名词，与 nehmen 同族。","cog":"英 numb（原义“被夺走（知觉）的”，与 nehmen 同源）","tip":"vernünftig 偏“理性、懂事、合理”；rational 偏学术“合乎理性的”。口语“像样的”义很常见：eine vernünftige Wohnung, v  Zugabe 是“返场加演”。"},{"w":"zugänglich","pos":"adj","ipa":"ˈt͡suːɡɛŋlɪç","lvl":"C1","forms":"zugänglicher · am zugänglichsten","senses":[{"zh":"（地点）可进入的，可到达的","de":"betretbar, erreichbar","ex":[{"de":"Das Gebäude ist auch für Rollstuhlfahrer zugänglich.","zh":"这栋楼轮椅使用者也能进入。"}]},{"zh":"（信息、资源）可获得的，公开的","de":"verfügbar, einsehbar","ex":[{"de":"Die Akten sind seit 2020 öffentlich zugänglich.","zh":"这些档案自2020年起向公众开放。"}]},{"zh":"（人）平易近人的；（对……）乐于接受的","de":"aufgeschlossen, umgänglich; offen für etw.","ex":[{"de":"Er ist für neue Ideen durchaus zugänglich.","zh":"他对新想法相当开放。"}]}],"use":["(öffentlich) zugänglich sein — （向公众）开放","jdm. etw. zugänglich machen — 使某人能接触/获得某物","für etw.(A) zugänglich sein — 对……持开放态度","Gegenteil: unzugänglich — 难以进入的；不好接近的"],"root":"zu·gäng·lich：Zugang（入口，通道；zu 向 + Gang 走）+ -lich →“可通向的”","fam":["Zugang","Gang","gehen","unzugänglich","Zugänglichkeit"],"ety":"派生自 Zugang；Gang 与 gehen 同族。","cog":"英 go, gang（与 gehen / Gang 同源）","tip":"“无障碍的”可说 barrierefrei；“开放获取”（学术）为 frei zugänglich / Open Access。"},{"w":"zulassen","pos":"v","ipa":"ˈt͡suːˌlasn̩","lvl":"B2","forms":"lässt zu · ließ zu · hat zugelassen","sep":true,"senses":[{"zh":"允许，容许，容忍","de":"etw. geschehen lassen, nicht verhindern","ex":[{"de":"Wir dürfen nicht zulassen, dass sich solche Fehler wiederholen.","zh":"我们绝不能允许这样的错误重演。"}]},{"zh":"（官方）批准，许可；（车辆）登记上牌；（药品）获准上市","de":"amtlich genehmigen, eine Zulassung erteilen","ex":[{"de":"Der Impfstoff wurde in der EU zugelassen.","zh":"该疫苗已在欧盟获批。"},{"de":"Er hat sein neues Auto noch nicht zugelassen.","zh":"他的新车还没上牌。"}]},{"zh":"接纳，准许参加（考试、学习）","de":"jdm. die Teilnahme, den Zugang erlauben","ex":[{"de":"Nur 20 Prozent der Bewerber werden zum Medizinstudium zugelassen.","zh":"只有百分之二十的申请者被医学专业录取。"}]},{"zh":"（口语）关着不开","de":"geschlossen lassen","ex":[{"de":"Lass bitte das Fenster zu, es zieht.","zh":"请别开窗，有穿堂风。"}]}],"use":["zulassen, dass … — 容许……发生","jdn. zu etw.(D) zulassen — 准许某人参加……","keinen Zweifel / keine Ausnahme zulassen — 不容置疑/不允许例外","die Zulassung — 许可，批准；（大学）录取；车辆行驶证"],"root":"zu·lass·en：zu-（向……、对……开放）+ lassen（让）→ “放行” → 允许、批准；另一义 zu（关着）+ lassen → 让它关着","fam":["lassen","Zulassung","zulässig","unzulässig","Zulassungsstelle"],"ety":"lassen < 中古高地德语 lāzen < 古高地德语 lāzan。","cog":"英 let；荷 laten","tip":"强变化：lässt zu – ließ zu – zugelassen。形容词 zulässig（允许的、合法的）很常用：Das ist rechtlich nicht zulässig."},{"w":"zumal","pos":"konj","ipa":"t͡suˈmaːl","lvl":"C1","senses":[{"zh":"（连词）尤其是因为，更何况","de":"(Konjunktion) besonders da, vor allem weil","ex":[{"de":"Ich bleibe heute zu Hause, zumal ich mich nicht wohlfühle.","zh":"我今天待在家里，更何况我还不太舒服。"},{"de":"Die Entscheidung fiel ihm schwer, zumal er das Team sehr schätzte.","zh":"这个决定让他很为难，尤其是因为他非常看重这个团队。"}]},{"zh":"（副词）尤其，特别是","de":"(Adverb) besonders, vor allem","ex":[{"de":"Die Straßen sind gefährlich, zumal im Winter.","zh":"这些道路很危险，尤其是在冬天。"}]}],"use":["连词：引导从属句（Nebensatz），变位动词位于句末；该从句通常放在主句之后，补充一个额外的、加强性的理由：…, zumal er keine Zeit hat.","zumal 从句一般不放在主句之前（*Zumal er keine Zeit hat, … 不自然）","也可写作 zumal da / zumal wenn：…, zumal da die Kosten steigen. —— 动词同样居末","副词：放在被强调成分之前（zumal im Winter, zumal bei Kindern），不影响句子语序"],"root":"zu·mal：zu（在）+ Mal（次，时刻）→ 原义“同时、一起” → 尤其、更何况","fam":["Mal","einmal","damals","ehemals"],"ety":"源自中古高地德语 ze māle（“同时、一起”），一般认为由此引申出“尤其”。","cog":"—","tip":"zumal 不是单纯的 weil：它给出的是“附加的、更有分量的理由”，前面主句通常本身已有道理。不要把 zumal 放在第一位后接倒装（*Zumal ist er krank）。"},{"w":"zunehmen","pos":"v","ipa":"ˈt͡suːneːmən","lvl":"B1","forms":"nimmt zu · nahm zu · hat zugenommen","sep":true,"senses":[{"zh":"增加，增长，加剧","de":"größer, stärker, mehr werden","ex":[{"de":"Die Zahl der Pendler hat in den letzten Jahren stark zugenommen.","zh":"近年来通勤者的数量大幅增加。"},{"de":"Der Druck auf die Regierung nimmt zu.","zh":"政府面临的压力越来越大。"}]},{"zh":"（体重）增加，长胖","de":"an Körpergewicht gewinnen","ex":[{"de":"Im Urlaub habe ich drei Kilo zugenommen.","zh":"度假期间我胖了三公斤。"}]}],"use":["an etw.(D) zunehmen — 在某方面增加：an Bedeutung zunehmen 越来越重要","um + Zahl zunehmen — 增加了……","zunehmend — 日益，越来越：zunehmend schwierig","die Zunahme — 增长 const ART = { m: 'der', f: 'die', n: 'das', pl: 'die' };
const POS = { n: '名词', v: '动词', adj: '形容词', adv: '副词', konj: '连词', präp: '介词', part: '小品词' };

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }

function buildIndex() {
  byKey = new Map(); INDEX = DICT.entries.map(e => {
    byKey.set(keyOf(e), e);
    const forms = [e.w, e.pl, e.gs, ...(String(e.forms || '').split(/[·,;\/]/))].filter(Boolean)
      .flatMap(f => String(f).replace(/^(der|die|das|des|hat|ist|sich)\s+/g, '').split(/\s+/)).filter(x => x.length > 2 && x !== '—');
    String(e.forms || '').split(/[·,;\/（）()]/).forEach(f => { f = f.replace(/^\s*(hat|ist|sich)\s+/, '').trim(); if (f.includes(' ')) forms.push(f); });
    const zh = (e.senses || []).map(s => s.zh).join('；');
    return { e, k: fold(e.w), forms: [...new Set(forms.map(fold))], zh };
  });
  $('#count').textContent = DICT.entries.length + ' 词 · ' + (DICT.version || '');
}

function lev(a, b) { if (Math.abs(a.length - b.length) > 2) return 9; const d = Array.from({length: a.length + 1}, (_, i) => [i]); for (let j = 1; j <= b.length; j++) d[0][j] = j; for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)); return d[a.length][b.length]; }

function search(raw) {
  const s = raw.trim(); if (!s) return [];
  if (/[一-鿿]/.test(s)) return INDEX.filter(x => x.zh.includes(s)).map(x => x.e).slice(0, 60);
  const f = fold(s); const out = [];
  for (const x of INDEX) {
    let r = -1;
    if (x.k === f) r = 0; else if (x.forms.includes(f)) r = 1; else if (x.k.startsWith(f)) r = 2;
    else if (f.length >= 3 && x.forms.some(y => y.startsWith(f))) r = 3; else if (f.length >= 4 && x.k.includes(f)) r = 4;
    if (r >= 0) out.push([r, x.k.length, x.e]);
  }
  out.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  return out.slice(0, 60).map(x => x[2]);
}
function suggest(raw) { const f = fold(raw); return INDEX.map(x => [lev(f, x.k), x.e]).filter(x => x[0] <= 2).sort((a, b) => a[0] - b[0]).slice(0, 6).map(x => x[1]); }

function hwHtml(e) { return (e.pos === 'n' && e.gen ? `<span class="art g-${e.gen}">${ART[e.gen]}</span>` : '') + esc(e.w); }
function rowHtml(e) { return `<li><button class="row" data-open="${esc(keyOf(e))}"><span class="hw">${hwHtml(e)}</span><span class="gl">${esc((e.senses?.[0]?.zh) || '')}</span></button></li>`; }

function renderHome() {
  const recent = history.map(k => byKey.get(k)).filter(Boolean).slice(0, 12);
  const pick = DICT.entries.length ? Array.from({length: 8}, (_, i) => DICT.entries[(dayNum() * 7 + i * 53) % DICT.entries.length]) : [];
  view.innerHTML = `<div class="stack">
    ${recent.length ? `<section><div class="label">最近查过</div><div class="chips">${recent.map(e => `<button class="chip" data-open="${esc(keyOf(e))}">${esc(e.w)}</button>`).join('')}</div></section>` : ''}
    <section><div class="label">今日随机 8 词</div><ul class="list">${[...new Set(pick)].map(rowHtml).join('')}</ul></section>
    <section class="legend"><span class="g-m">■ der 阳性</span><span class="g-f">■ die 阴性</span><span class="g-n">■ das 中性</span></section>
  </div>`;
}
function dayNum() { return Math.floor(Date.now() / 864e5); }

function renderResults(s) {
  const res = search(s);
  if (res.length) { view.innerHTML = `<ul class="list">${res.map(rowHtml).join('')}</ul>`; return; }
  const sug = /[一-鿿]/.test(s) ? [] : suggest(s);
  view.innerHTML = `<div class="empty">词库里还没有“${esc(s)}”。${sug.length ? '你是不是要找：' : '可以在“词库”页导入更大的词库文件。'}</div>
    ${sug.length ? `<ul class="list">${sug.map(rowHtml).join('')}</ul>` : ''}`;
}

function renderEntry(e) {
  current = e;
  history = [keyOf(e), ...history.filter(k => k !== keyOf(e))].slice(0, 40); store.set('history', history);
  const starred = book.includes(keyOf(e));
  const nounInfo = e.pos === 'n' ? [e.gs && `单数二格 ${esc(e.gs)}`, e.pl && `复数 ${e.pl === '—' ? '无' : esc(e.pl)}`].filter(Boolean).join(' · ') : '';
  const formsLabel = e.pos === 'v' ? '现在时三单 · 过去时 · 完成时' + (e.sep === true ? ' · 可分动词' : e.sep === false ? ' · 不可分动词' : '') : (e.pos === 'adj' ? '比较级 · 最高级' : '');
  view.innerHTML = `<article class="entry">
    <div class="ehead">
      <div class="line1"><h1 lang="de" class="${e.w.length > 13 ? 'long' : ''}">${hwHtml(e)}</h1>
        <button class="iconbtn speak" id="say" aria-label="朗读"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
        <button class="iconbtn star" id="star" aria-label="加入生词本" aria-pressed="${starred}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></button>
      </div>
      <div class="meta">${e.ipa ? `<span class="ipa">[${esc(e.ipa)}]</span>` : ''}<span class="pos">${POS[e.pos] || esc(e.pos || '')}</span>${e.lvl ? `<span class="lvl">${esc(e.lvl)}</span>` : ''}</div>
    </div>
    ${nounInfo ? `<div class="forms">${nounInfo}</div>` : ''}
    ${e.forms ? `<div class="forms"><small>${formsLabel}</small>${esc(e.forms)}</div>` : ''}
    ${(e.senses || []).length ? `<section class="sec"><h2>释义</h2>${e.senses.map((s, i) => `<div class="sense"><span class="n">${i + 1}</span><div>
        <div class="zh">${esc(s.zh)}</div>${s.de ? `<div class="de">${esc(s.de)}</div>` : ''}
        ${(s.ex || []).map(x => `<div class="ex"><div class="d">${esc(x.de)}</div><div class="z">${esc(x.zh)}</div></div>`).join('')}
      </div></div>`).join('')}</section>` : ''}
    ${(e.use || []).length ? `<section class="sec"><h2>用法与搭配</h2><ul class="use">${e.use.map(u => `<li>${esc(u)}</li>`).join('')}</ul></section>` : ''}
    ${e.root ? `<section class="sec"><h2>构词</h2><div class="prose">${esc(e.root)}</div>${(e.fam || []).length ? `<div class="chips">${e.fam.map(f => `<button class="chip" data-find="${esc(f)}">${esc(f)}</button>`).join('')}</div>` : ''}</section>` : ''}
    ${e.ety || e.cog ? `<section class="sec"><h2>词源</h2>${e.ety ? `<div class="prose">${esc(e.ety)}</div>` : ''}${e.cog ? `<div class="prose"><b>同源 / 来源词：</b>${esc(e.cog)}</div>` : ''}</section>` : ''}
    ${e.tip ? `<section class="sec tip"><h2>辨析与易错</h2><div class="prose">${esc(e.tip)}</div></section>` : ''}
    <button class="btn ghost" id="back">返回</button>
  </article>`;
  main.scrollTop = 0;
}

function renderBook() {
  const items = book.map(k => byKey.get(k)).filter(Boolean);
  view.innerHTML = `<div class="stack"><div class="label">生词本 · ${items.length} 词（保存在本机浏览器）</div>
    ${items.length ? `<ul class="list">${items.map(rowHtml).join('')}</ul>
    <div class="btns"><button class="btn ghost" id="copybook">复制生词列表</button></div>` : `<div class="empty">查词时点右上角的星标，词就会收进这里。</div>`}</div>`;
}

function renderLib() {
  const custom = store.get('customDict', null);
  view.innerHTML = `<div class="stack">
    <section class="card"><h3>当前词库</h3>
      <dl class="kv"><dt>名称</dt><dd>${esc(DICT.name || '')}</dd><dt>版本</dt><dd>${esc(DICT.version || '')}</dd><dt>词条数</dt><dd>${DICT.entries.length}</dd><dt>来源</dt><dd>${custom ? '你导入的文件' : (EMBED ? '本文件内置（离线）' : '在线内置词库')}</dd></dl>
      <div class="note">词库已缓存在本机，断网后再打开这个页面也能查。</div>
    </section>
    <section class="card"><h3>导入词库文件</h3>
      <div>选择一个 Wortwurzel 格式的 <b>.json</b> 词库文件。新词会合并进来，同名词条以文件为准。</div>
      <div class="btns"><button class="btn" id="import">选择文件导入</button>${custom ? '<button class="btn ghost" id="reset">恢复内置词库</button>' : ''}</div>
    </section>
    <section class="card"><h3>下载离线版</h3>
      <div>完整词库文件 <b>wortwurzel.json</b> 和可以离线打开的 <b>Wortwurzel离线版.html</b> 都在项目对话的附件里，下载后用手机浏览器直接打开 html 即可，不需要网络。</div>
    </section>
    <section class="card"><h3>外观</h3><div class="btns">
      <button class="btn ghost" data-theme-set="">跟随系统</button><button class="btn ghost" data-theme-set="light">浅色</button><button class="btn ghost" data-theme-set="dark">深色</button></div></section>
  </div>`;
}

function render() {
  for (const b of document.querySelectorAll('nav.tabs button')) b.setAttribute('aria-selected', b.dataset.tab === tab);
  $('#clear').hidden = !q.value;
  if (tab === 'book') return renderBook();
  if (tab === 'lib') return renderLib();
  if (current) return renderEntry(current);
  if (q.value.trim()) return renderResults(q.value);
  renderHome();
}

function open(key) { const e = byKey.get(key); if (!e) return; tab = 'search'; renderEntry(e); for (const b of document.querySelectorAll('nav.tabs button')) b.setAttribute('aria-selected', b.dataset.tab === 'search'); }

q.addEventListener('input', () => { current = null; tab = 'search'; render(); });
q.addEventListener('keydown', ev => { if (ev.key === 'Enter') { const r = search(q.value); if (r.length) { open(keyOf(r[0])); q.blur(); } } });
$('#clear').onclick = () => { q.value = ''; current = null; render(); q.focus(); };
$('#uml').addEventListener('pointerdown', ev => ev.preventDefault());
$('#uml').addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; const s = q.selectionStart ?? q.value.length; q.value = q.value.slice(0, s) + b.textContent + q.value.slice(q.selectionEnd ?? s); q.setSelectionRange(s + 1, s + 1); q.dispatchEvent(new Event('input')); });
document.querySelector('nav.tabs').addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; tab = b.dataset.tab; if (tab === 'search') current = null; render(); main.scrollTop = 0; });

view.addEventListener('click', async ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.open) return open(t.dataset.open);
  if (t.dataset.find) { const r = search(t.dataset.find); if (r.length && fold(r[0].w) === fold(t.dataset.find)) return open(keyOf(r[0])); q.value = t.dataset.find; current = null; return render(); }
  if (t.id === 'back') { current = null; return render(); }
  if (t.id === 'star') { const k = keyOf(current); book = book.includes(k) ? book.filter(x => x !== k) : [k, ...book]; store.set('book', book); t.setAttribute('aria-pressed', book.includes(k)); toast(book.includes(k) ? '已加入生词本' : '已移出生词本'); return; }
  if (t.id === 'say') { try { const u = new SpeechSynthesisUtterance(current.w); u.lang = 'de-DE'; u.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch { toast('这个浏览器不支持朗读'); } return; }
  if (t.id === 'import') return $('#file').click();
  if (t.id === 'reset') { store.set('customDict', null); await load(); toast('已恢复内置词库'); return render(); }
  if (t.id === 'copybook') { const txt = book.map(k => { const e = byKey.get(k); return e ? `${e.gen ? ART[e.gen] + ' ' : ''}${e.w}\t${e.senses?.[0]?.zh || ''}` : k; }).join('\n'); try { await navigator.clipboard.writeText(txt); toast('已复制 ' + book.length + ' 个词'); } catch { toast('复制失败，请手动选择'); } return; }
  if ('themeSet' in t.dataset) { const v = t.dataset.themeSet; if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme; store.set('theme', v); return; }
});

$('#file').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text()); const entries = Array.isArray(data) ? data : data.entries;
    if (!Array.isArray(entries) || !entries.every(e => e && e.w)) throw new Error('格式不对');
    const prev = store.get('customDict', null);
    const merged = new Map((prev?.entries || BASE.entries).map(e => [e.w, e])); entries.forEach(e => merged.set(e.w, e));
    const dict = { name: data.name || BASE.name, version: (data.version || '') + ' + 导入', entries: [...merged.values()].sort((a, b) => a.w.localeCompare(b.w, 'de')) };
    if (!store.set('customDict', dict)) toast('导入成功，但浏览器不允许保存，刷新后会失效');
    DICT = dict; buildIndex(); toast(`导入了 ${entries.length} 个词条`); render();
  } catch (err) { toast('导入失败：文件不是有效的词库 JSON'); }
});

let BASE = null, EMBED = false;
async function load() {
  const emb = JSON.parse(document.getElementById('embedded-dict').textContent);
  if (emb) { BASE = emb; EMBED = true; }
  else {
    try { const r = await fetch('wortwurzel.json', { cache: 'no-cache' }); BASE = await r.json(); store.set('cache', BASE); }
    catch { BASE = store.get('cache', null); }
  }
  if (!BASE) { view.innerHTML = '<div class="empty">词库没有加载成功。请联网后刷新，或在“词库”页导入词库文件。</div>'; BASE = { entries: [] }; }
  DICT = store.get('customDict', null) || BASE; buildIndex();
}
const th = store.get('theme', ''); if (th) document.documentElement.dataset.theme = th;
load().then(() => { const h = location.hash.slice(1); if (h && byKey.get(decodeURIComponent(h))) open(decodeURIComponent(h)); else render(); });
})();
</script>

</body></html>

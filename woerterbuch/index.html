<style>
/* Layout: one-screen phone app. Fixed search header, scrolling middle, fixed bottom tab bar; on wide screens the same column is centered. */
:root {
  --bg: #f3f5f7;          /* cool paper */
  --surface: #ffffff;
  --ink: #17212b;
  --muted: #5d6b78;
  --line: #dde3e9;
  --accent: #1d4f7a;      /* Preußischblau */
  --accent-soft: #e3ecf5;
  --der: #2557a7; --die: #b4323b; --das: #2a7a4b;
  --warn-bg: #fff6df; --warn-fg: #7a5600;
  --f-head: "Literata", "Noto Serif", Georgia, serif;
  --f-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Noto Sans", sans-serif;
  --f-ipa: "Noto Sans", "Charis SIL", "Doulos SIL", "Lucida Grande", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171d; --surface: #19212a; --ink: #e6ecf1; --muted: #93a2b0; --line: #2a3541;
  --accent: #8cb8e6; --accent-soft: #1f3044;
  --der: #7fa8ee; --die: #f08a91; --das: #78c99a; --warn-bg: #3a2f12; --warn-fg: #f1cf7a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11171d; --surface: #19212a; --ink: #e6ecf1; --muted: #93a2b0; --line: #2a3541;
  --accent: #8cb8e6; --accent-soft: #1f3044;
  --der: #7fa8ee; --die: #f08a91; --das: #78c99a; --warn-bg: #3a2f12; --warn-fg: #f1cf7a; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6; overflow: hidden; -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); }
@media (min-width: 761px) { .app { border-inline: 1px solid var(--line); } }

header.top { flex: none; padding: 10px 16px 10px; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.brand b { font-family: var(--f-head); font-size: 20px; font-weight: 700; letter-spacing: .01em; }

.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 6px 0 12px; height: 46px; }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 17px; height: 100%; }
.iconbtn { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); flex: none; }
.iconbtn:hover { background: var(--accent-soft); color: var(--accent); }
.iconbtn svg { width: 20px; height: 20px; }
.umlauts { display: flex; gap: 6px; }
.umlauts button { flex: 1; height: 34px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; font-family: var(--f-head); font-size: 16px; }
.umlauts button:active { background: var(--accent-soft); }

main { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.pad { padding: 12px 16px 24px; }

nav.tabs { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--surface); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs button { border: 0; background: transparent; padding: 8px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-selected="true"] { color: var(--accent); font-weight: 600; }
nav.tabs button.switch { border-left: 1px solid var(--line); color: var(--accent); }

.label { font-size: 12px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; margin: 4px 0 6px; }
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.list li + li { border-top: 1px solid var(--line); }
.row { display: flex; gap: 10px; align-items: baseline; padding: 11px 14px; width: 100%; text-align: left; border: 0; background: transparent; }
.row:hover { background: var(--accent-soft); }
.row .hw { font-family: var(--f-head); font-weight: 600; font-size: 17px; white-space: nowrap; }
.row .gl { color: var(--muted); font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

.g-m { color: var(--der); } .g-f { color: var(--die); } .g-n { color: var(--das); } .g-pl { color: var(--muted); }

.empty { color: var(--muted); padding: 24px 4px; text-align: center; font-size: 15px; }
.stack { display: flex; flex-direction: column; gap: 18px; }

/* entry */
.entry { display: flex; flex-direction: column; gap: 14px; }
.ehead { display: flex; flex-direction: column; gap: 4px; }
.ehead .line1 { display: flex; align-items: flex-start; gap: 8px; }

.ehead h1.long { font-size: clamp(22px, 6.4vw, 30px); }

.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; color: var(--muted); font-size: 14px; }
.ipa { font-family: var(--f-ipa); color: var(--ink); }
.lvl { font-size: 11px; font-weight: 600; letter-spacing: .06em; border: 1px solid var(--accent); color: var(--accent); border-radius: 4px; padding: 0 5px; }
.pos { font-style: italic; }
.forms { font-family: var(--f-head); font-size: 15px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.forms small { display: block; font-family: var(--f-body); font-size: 12px; color: var(--muted); }
.star[aria-pressed="true"] { color: #d39a00; }
.star[aria-pressed="true"] svg { fill: currentColor; }

.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.sec h2 { font-size: 13px; letter-spacing: .08em; color: var(--accent); margin: 0; font-weight: 600; }
.sense { display: grid; grid-template-columns: 22px 1fr; gap: 0 6px; }
.sense + .sense { border-top: 1px dashed var(--line); padding-top: 8px; }
.sense .n { font-family: var(--f-head); font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.sense .zh { font-size: 16.5px; font-weight: 500; }
.sense .de { color: var(--muted); font-family: var(--f-head); font-size: 15px; }
.ex { margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--accent-soft); }
.ex .d { font-family: var(--f-head); font-size: 15.5px; }
.ex .z { color: var(--muted); font-size: 14px; }
.sense > div { min-width: 0; }
ul.use { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
ul.use li { font-size: 15px; }
.prose { font-size: 15px; }
.tip { background: var(--warn-bg); color: var(--warn-fg); border-color: transparent; }
.tip h2 { color: var(--warn-fg); }
.hitbar { background: var(--accent-soft); color: var(--ink); border-radius: 10px; padding: 9px 12px; font-size: 14px; line-height: 1.5; }
.hitbar b { font-family: var(--f-head); color: var(--accent); }
.row .gl .hint { color: var(--accent); }
.row.h2 { flex-direction: column; align-items: stretch; gap: 2px; padding-right: 86px; position: relative; }
.row.h2 .gl { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row.h2 .gl .pos { color: var(--accent); font-style: normal; margin-right: 4px; }
.row.h2 .gl .pos.g-f { color: var(--die); } .row.h2 .gl .pos.g-m { color: var(--der); } .row.h2 .gl .pos.g-n { color: var(--das); }
.row.h2 .badge { position: absolute; right: 12px; top: 12px; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; background: var(--bg); }
.row.h2 .q { color: var(--muted); font-size: 13px; margin-right: 6px; }
.conj details { border-top: 1px solid var(--line); }
.conj details:first-of-type { border-top: 0; }
.conj summary { cursor: pointer; padding: 8px 0; font-size: 14px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
.conj summary::after { content: "＋"; color: var(--muted); }
.conj details[open] summary::after { content: "－"; }
.conj summary::-webkit-details-marker { display: none; }
.cj { display: grid; grid-template-columns: 5.5em 1fr; gap: 2px 10px; padding: 0 0 8px; font-size: 15px; }
.cj .who { color: var(--muted); font-size: 13px; padding-top: 2px; }
.cj .f { font-family: var(--f-head); overflow-wrap: anywhere; }
.cj .on { background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 4px; margin-left: -4px; }
.conj .note { color: var(--muted); font-size: 13px; }
.conj .parts { font-size: 14px; color: var(--muted); }
.conj .parts b { font-family: var(--f-head); color: var(--ink); font-weight: 600; }
.speak { color: var(--accent); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 15px; }
.card h3 { margin: 0; font-family: var(--f-head); font-size: 18px; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; text-align: center; }
.btn.ghost { background: transparent; color: var(--accent); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-variant-numeric: tabular-nums; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.note { font-size: 13px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 14px; z-index: 9; max-width: calc(100% - 32px); }
.legend { display: flex; gap: 14px; font-size: 13px; }
/* sentence translation */
.trout { font-size: 17px; line-height: 1.7; }
.trin, .trin1 { display: block; width: 100%; box-sizing: border-box; margin-top: 2px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); color: var(--ink); font: inherit; font-size: 15px; outline: none; }
.trin1:focus { border-color: var(--accent); }
.srcline { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.btn.small { padding: 5px 10px; font-size: 13px; }
#extcard .row.h2 { position: relative; padding-right: 76px; } #extcard .row.h2 .btn.small { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); }
a.btn { text-decoration: none; display: inline-block; }
.trout[lang="de"] { font-family: var(--f-head); }
.trw { display: grid; grid-template-columns: 1fr; gap: 8px; }
.trw .w { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.trw .w .chip { font-size: 16px; }
.trw .w .frm { color: var(--muted); font-size: 13px; }
.trw .w .m { flex-basis: 100%; font-size: 15px; }
.note a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { main { scroll-behavior: smooth; } }
</style>

    <button role="tab" data-tab="lib" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>设置</button>

<script>
(() => {
const $ = s => document.querySelector(s);
const view = $('#view'), q = $('#q'), main = $('#main');
const store = {
  get(k, d) { try { const v = localStorage.getItem('ww.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('ww.' + k, JSON.stringify(v)); return true; } catch { return false; } }
};
const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => { try { const r = indexedDB.open('wortwurzel', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }));
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => { const t = db.transaction('kv', mode); const q = fn(t.objectStore('kv')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }));
  return { get: k => tx('readonly', s => s.get(k)).catch(() => null), set: (k, v) => tx('readwrite', s => s.put(v, k)).then(() => true, () => false) };
})();
let CUSTOM = null, EXT = [], EXTGLOSS = new Map(); // EXT: imported external dictionaries [{name, added, entries}], kept in IndexedDB
let DICT = { entries: [] }, INDEX = [], byKey = new Map();
let tab = 'search', current = null, history = store.get('history', []), book = store.get('book', []);
window.__wwReload = () => { history = store.get('history', []); book = store.get('book', []); history = (Array.isArray(history) ? history : []).map(h => typeof h === 'string' ? { k: h, n: 1, t: 0 } : h).filter(h => h && (h.k || h.q)); if (tab === 'book') renderBook(); else if (tab === 'search' && !current && !q.value.trim()) renderHome(); };
// search history entries: {k: headword} for opened entries, {q: text, tr?: translation} for sentences and misses; n = times, t = last time
history = (Array.isArray(history) ? history : []).map(h => typeof h === 'string' ? { k: h, n: 1, t: 0 } : h).filter(h => h && (h.k || h.q));
function remember(item) {
  const same = h => item.k ? h.k === item.k : (!h.k && h.q === item.q);
  const old = history.find(same);
  history = [{ ...item, n: (old?.n || 0) + 1, t: Date.now() }, ...history.filter(h => !same(h))].slice(0, 200); store.set('history', history);
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold = s => String(s).toLowerCase().replace(/^sich\s+/, '').replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss').replace(/ae/g,'a').replace(/oe/g,'o').replace(/ue/g,'u').replace(/[·\-\s]/g,'');
const keyOf = e => e.w;
const ART = { m: 'der', f: 'die', n: 'das', pl: 'die' };
const POS = { n: '名词', v: '动词', adj: '形容词', adv: '副词', konj: '连词', präp: '介词', part: '小品词', pron: '代词', num: '数词', art: '冠词', interj: '感叹词' };

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }

// CONJ-START
// Builds a full conjugation table from the entry's headword and principal parts
// ("gibt · gab · hat gegeben"). Returns null when the parts can't be parsed safely.
const CONJ = (() => {
  const PRON = ['ich', 'du', 'er/sie/es', 'wir', 'ihr', 'sie/Sie'];
  const RACC = ['mich', 'dich', 'sich', 'uns', 'euch', 'sich'];
  const RDAT = ['mir', 'dir', 'sich', 'uns', 'euch', 'sich'];
  const HABEN = ['habe', 'hast', 'hat', 'haben', 'habt', 'haben'];
  const SEIN = ['bin', 'bist', 'ist', 'sind', 'seid', 'sind'];
  const WERDEN = ['werde', 'wirst', 'wird', 'werden', 'werdet', 'werden'];
  const MODAL = ['können', 'müssen', 'dürfen', 'sollen', 'wollen', 'mögen'];
  const MODAL_UML = ['können', 'müssen', 'dürfen', 'mögen'];
  const UML_WEAK = ['denken', 'bringen', 'wissen', 'haben'];
  const MIXED_PLAIN = ['kennen', 'nennen', 'brennen', 'rennen', 'senden', 'wenden'];
  const KONJ_EXC = { stehen: 'stünde', helfen: 'hülfe', sterben: 'stürbe', werfen: 'würfe', verderben: 'verdürbe', beginnen: 'begänne', schwimmen: 'schwömme', gewinnen: 'gewönne', empfehlen: 'empföhle', befehlen: 'beföhle' };
  const ends = (w, list) => list.find(x => w === x || (w.endsWith(x) && w.length > x.length));
  const sib = s => /[sßzx]$/.test(s);
  const needE = s => /[td]$/.test(s) || /[^aeiouäöülrhmn][mn]$/.test(s);
  const umlaut = s => {
    const m = s.match(/^(.*?)(au|a|o|u)([^aeiouäöü]*)$/);
    if (!m || (m[2] === 'u' && /[ea]$/.test(m[1]))) return s;
    return m[1] + ({ au: 'äu', a: 'ä', o: 'ö', u: 'ü' })[m[2]] + m[3];
  };

  function parse(e) {
    let f = String(e.forms || '');
    const VAR = /[（(；;／]|\s\/\s/;
    const variants = VAR.test(f);

$('#clear').onclick = () => { q.value = ''; current = null; render(); q.focus(); };
$('#uml').addEventListener('pointerdown', ev => ev.preventDefault());
$('#uml').addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; const s = q.selectionStart ?? q.value.length; q.value = q.value.slice(0, s) + b.textContent + q.value.slice(q.selectionEnd ?? s); q.setSelectionRange(s + 1, s + 1); q.dispatchEvent(new Event('input')); });
document.querySelector('nav.tabs').addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; if (b.dataset.go === 'daily') { location.href = DAILY_URL; return; } tab = b.dataset.tab; if (tab === 'search') current = null; setupOpen = false; render(); main.scrollTop = 0; });

view.addEventListener('click', async ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.open) return open(t.dataset.open);
  if (t.dataset.q != null) { q.value = t.dataset.q; current = null; tab = 'search'; return render(); }
  if (t.id === 'clearhist') { history = []; store.set('history', history); toast('已清空查词记录'); return render(); }
  if (t.dataset.find) { const r = search(t.dataset.find); if (r.length && fold(r[0].w) === fold(t.dataset.find)) return open(keyOf(r[0])); q.value = t.dataset.find; current = null; return render(); }
  if (t.id === 'back') { current = null; return render(); }
  if (t.id === 'trgo') { if (trLast && trLast.src === q.value.trim()) trLast = null; return translate(q.value); }
  if (t.id === 'trstop') { trCtl?.abort(); return; }
  if (t.id === 'trforce') { forceTr = q.value.trim(); render(); return translate(q.value); }
  if (t.dataset.setup) { setupOpen = true; setupPick = null; tab = 'lib'; render(); main.scrollTop = 0; return; }
  if (t.id === 'setup-back') { setupOpen = false; render(); main.scrollTop = 0; return; }
  if (t.dataset.preset) { setupPick = t.dataset.preset; return render(); }
  if (t.id === 'm-clear') { MODEL = null; store.set('model', null); setupPick = null; toast('已改回 Workers AI'); return render(); }
  if (t.id === 'm-save') {
    const m = { url: $('#m-url').value.trim().replace(/\/+$/, ''), name: $('#m-name').value.trim(), key: $('#m-key').value.trim() };
    if (!/^https:\/\//.test(m.url) || !m.name || !m.key) return toast('接口地址、模型名、API Key 都要填');
    const prev = MODEL; MODEL = m; t.disabled = true; t.textContent = '测试中…';
    try { const r = await apiTranslate('Guten Morgen!', 'de2zh'); if (!r || !r.tr) throw { message: '模型没有返回译文' }; store.set('model', m); toast('已保存，测试译文：' + String(r.tr).slice(0, 20)); }
    catch (e) { MODEL = prev; toast('测试失败：' + String(e.message || '连不上这个模型').slice(0, 60)); t.disabled = false; t.textContent = '保存并测试'; return; }
    setupOpen = false; setupPick = null; return render();
  }
  if (t.id === 'trsay') { try { const u = new SpeechSynthesisUtterance(trLast?.tr || ''); u.lang = 'de-DE'; u.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch { toast('这个浏览器不支持朗读'); } return; }
  if (t.id === 'star') { const k = keyOf(current); book = book.includes(k) ? book.filter(x => x !== k) : [k, ...book]; store.set('book', book); t.setAttribute('aria-pressed', book.includes(k)); toast(book.includes(k) ? '已加入生词本' : '已移出生词本'); return; }
  if (t.id === 'say') { try { const u = new SpeechSynthesisUtterance(current.w); u.lang = 'de-DE'; u.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch { toast('这个浏览器不支持朗读'); } return; }
  if (t.id === 'import') return $('#file').click();
  if (t.id === 'refetch') { toast('正在下载最新词库…'); const d = await fetchBase(); if (!d) return toast('没有连上网，稍后再试'); BASE = d; SRC = '在线词库（最新）'; STALE = false; idb.set('cache', d); if (!CUSTOM) applyExt(); toast(`已更新：${d.entries.length} 词`); return render(); }
  if (t.id === 'reset') { await idb.set('customDict', null); await load(); toast('已恢复内置词库'); return render(); }
  if (t.dataset.extdel) { const d = EXT[+t.dataset.extdel]; if (!d || !confirm(`删除导入的词典「${d.name}」？`)) return; EXT.splice(+t.dataset.extdel, 1); idb.set('extDicts', EXT); applyExt(); toast('已删除'); return render(); }
  if (t.id === 'copybook') { const txt = book.map(k => { const e = byKey.get(k); return e ? `${e.gen ? ART[e.gen] + ' ' : ''}${e.w}\t${e.senses?.[0]?.zh || ''}` : k; }).join('\n'); try { await navigator.clipboard.writeText(txt); toast('已复制 ' + book.length + ' 个词'); } catch { toast('复制失败，请手动选择'); } return; }
  if ('themeSet' in t.dataset) { const v = t.dataset.themeSet; if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme; store.set('theme', v); return; }
});

// Merge the base dictionary with the imported ones: words the base lacks become entries, the rest show under 其他词典.
function applyExt() {
  const base = CUSTOM || BASE; EXTGLOSS = new Map(); const have = new Set(base.entries.map(e => fold(e.w))); const extra = [];
  for (const d of EXT) for (const e of d.entries) {
    const k = fold(e.w);
    if (have.has(k)) { let g = EXTGLOSS.get(k); if (!g) EXTGLOSS.set(k, g = []); g.push({ src: d.name, zh: (e.senses || []).map(x => x.zh).join('；'), w: e.w }); }
    else { have.add(k); extra.push({ ...e, src: d.name, ext: true }); }
  }
  DICT = extra.length ? { ...base, entries: base.entries.concat(extra) } : base; buildIndex();
}
function extHtml(e) {
  const g = e.ext ? [] : EXTGLOSS.get(fold(e.w)) || [];
  if (e.ext) return `<div class="note">来自你导入的词典「${esc(e.src)}」</div>`;
  return g.length ? `<section class="sec"><h2>其他词典</h2><ul class="use">${g.map(x => `<li><b>${esc(x.src)}</b>${x.w !== e.w ? ` (${esc(x.w)})` : ''}：${esc(x.zh)}</li>`).join('')}</ul></section>` : '';
}
const GEN = { der: 'm', die: 'f', das: 'n', m: 'm', f: 'f', n: 'n', 'm.': 'm', 'f.': 'f', 'n.': 'n', r: 'm', e: 'f', s: 'n' };
const POSIN = { n: 'n', nomen: 'n', subst: 'n', substantiv: 'n', noun: 'n', v: 'v', vt: 'v', vi: 'v', verb: 'v', vb: 'v', adj: 'adj', adjektiv: 'adj', adjective: 'adj', a: 'adj', adv: 'adv', adverb: 'adv', präp: 'präp', prep: 'präp', präposition: 'präp', konj: 'konj', conj: 'konj', pron: 'pron', num: 'num', art: 'art', interj: 'interj', int: 'interj', part: 'part' };
const hasZh = t => /[一-鿿]/.test(String(t || ''));
// one headword + gloss -> entry; understands "der Hund", "Hund, der", "Hund (m)", "Hund m.", "sich freuen"
function extEntry(w, zh, pos, gen) {
  w = String(w || '').replace(/\s+/g, ' ').trim(); zh = String(zh || '').replace(/\s+/g, ' ').trim();
  if (!w || !zh || w.length > 60 || hasZh(w)) return null;
  let m;
  if ((m = w.match(/^(der|die|das)\s+(.+)$/i))) { gen = gen || GEN[m[1].toLowerCase()]; w = m[2]; }
  else if ((m = w.match(/^(.+?),\s*(der|die|das)$/i))) { gen = gen || GEN[m[2].toLowerCase()]; w = m[1]; }
  else if ((m = w.match(/^(.+?)\s*[\(（]\s*(der|die|das|[mfn])\.?\s*[\)）]$/i))) { gen = gen || GEN[m[2].toLowerCase()]; w = m[1]; }
  else if ((m = w.match(/^(.+?)\s+([mfn])\.?$/i))) { gen = gen || GEN[m[2].toLowerCase()]; w = m[1]; }
  else if ((m = w.match(/^([rs]|e)\s+([A-ZÄÖÜ].+)$/))) { gen = gen || GEN[m[1]]; w = m[2]; }
  w = w.replace(/^(der|die|das)\s+/i, '').trim(); if (!w) return null;
  pos = POSIN[String(pos || '').toLowerCase().replace(/\.$/, '')] || (gen ? 'n' : (/^[A-ZÄÖÜ]/.test(w) && !/\s/.test(w) ? 'n' : ''));
  if (pos !== 'n') gen = undefined;
  return { w, pos, gen, senses: [{ zh }] };
}
function parseExternal(text) {
  text = text.replace(/^﻿/, '');
  const out = [];
  if (/^\s*[\[{]/.test(text)) {
    const data = JSON.parse(text);
    const arr = Array.isArray(data) ? data : Array.isArray(data.entries) ? data.entries : Array.isArray(data.words) ? data.words : null;
    if (arr) for (const e of arr) {
      if (!e || typeof e !== 'object') continue;
      if (e.w && Array.isArray(e.senses)) { out.push({ ...e }); continue; } // Wortwurzel format: keep the whole entry
      const w = e.w ?? e.word ?? e.de ?? e.german ?? e.headword ?? e.term ?? e.front ?? e.lemma;
      const zh = e.zh ?? e.cn ?? e.chinese ?? e.meaning ?? e.translation ?? e.definition ?? e.back ?? e.def ?? e.gloss;
      const x = extEntry(w, Array.isArray(zh) ? zh.join('；') : zh, e.pos, e.gen); if (x) out.push(x);
    } else if (data && typeof data === 'object') for (const [w, v] of Object.entries(data)) { const x = extEntry(w, typeof v === 'string' ? v : v && (v.zh || v.meaning || v.cn)); if (x) out.push(x); }
    return out;
  }
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const cnt = d => lines.filter(l => l.includes(d)).length;
  const delim = ['\t', '|', ';', '，', ',', '：', ':', '→', '=', ' - ', ' – '].map(d => [d, cnt(d)]).filter(([, n]) => n >= Math.max(2, lines.length * 0.6)).sort((a, b) => b[1] - a[1])[0]?.[0];
  const split = l => {
    if (delim === ',' || delim === ';') { const cols = []; let cur = '', q = false; for (const c of l) { if (c === '"') q = !q; else if (c === delim && !q) { cols.push(cur); cur = ''; } else cur += c; } cols.push(cur); return cols.map(c => c.trim()); }
    if (delim) return l.split(delim).map(c => c.trim());
    const m = l.match(/^(.+?)\s{2,}(.+)$/) || l.match(/^([^一-鿿]+?)\s*([一-鿿].*)$/); return m ? [m[1], m[2]] : [l];
  };
  lines.forEach((l, i) => {
    const cols = split(l).filter(c => c !== '');
    if (cols.length < 2) return;
    if (i === 0 && !cols.some(hasZh) && /word|wort|德|单词|term|front|meaning|释义|headword/i.test(l)) return; // header row
    const w = cols[0]; const zh = cols.slice(1).find(hasZh) || cols[1];
    const pos = cols.slice(1).find(c => POSIN[c.toLowerCase().replace(/\.$/, '')]);
    const x = extEntry(w, zh, pos); if (x) out.push(x);
  });
  return out;
}
$('#file').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  if (/\.(mdx|mdd|dict|dsl|bgl|apkg|xlsx|xls|pdf|docx?)$/i.test(f.name)) return toast('这种格式暂不支持，请先用词典软件导出为 txt / csv / json');
  try {
    const buf = await f.arrayBuffer(); let text = new TextDecoder('utf-8').decode(buf);
    if ((text.match(/\uFFFD/g) || []).length > 3) { try { text = new TextDecoder('gbk').decode(buf); } catch {} }
    const entries = parseExternal(text);
    if (!entries.length) throw new Error('empty');
    const name = f.name.replace(/\.[^.]+$/, '');
    EXT = EXT.filter(d => d.name !== name).concat({ name, added: new Date().toISOString().slice(0, 10), entries });
    if (!(await idb.set('extDicts', EXT))) toast('导入成功，但浏览器不允许保存，刷新后会失效');
    applyExt(); const fresh = entries.filter(e => !EXTGLOSS.has(fold(e.w))).length;
    toast(`导入「${name}」：${entries.length} 个词条，其中 ${entries.length - fresh} 个词库里已有`); render();
  } catch (err) { toast('没有读到词条：请确认每行是「德语词 分隔符 中文释义」，或 JSON 数组'); }
});

let BASE = null, EMBED = false, SRC = '', STALE = false;
async function fetchBase() {
  for (let i = 0; i < 2; i++) {
    try {
      const get = async f => { const r = await fetch(f + '?v=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw 0; return r.json(); };
      const d = await get('wortwurzel.json');
      // large dictionaries are published as a small manifest plus several entry files
      if (d && Array.isArray(d.parts)) { const ps = await Promise.all(d.parts.map(get)); d.entries = ps.flatMap(x => x.entries || []); delete d.parts; if (d.count && d.entries.length !== d.count) throw 0; }
      if (d && d.entries && d.entries.length) return d;
    } catch {}
  }
  return null;
}
async function load() {
  const emb = JSON.parse(document.getElementById('embedded-dict').textContent);
  if (emb) { BASE = emb; EMBED = true; SRC = '本文件内置（离线）'; }
  else {
    BASE = await fetchBase();
    if (BASE) { SRC = '在线词库（最新）'; idb.set('cache', BASE); }
    else { BASE = await idb.get('cache'); STALE = !!BASE; SRC = '本机缓存（未联网）'; }
  }
  if (!BASE) { view.innerHTML = '<div class="empty">词库没有加载成功。请联网后刷新，或在“设置”页导入词典文件。</div>'; BASE = { entries: [] }; }
  CUSTOM = await idb.get('customDict'); EXT = (await idb.get('extDicts')) || []; applyExt();
}
const th = store.get('theme', ''); if (th) document.documentElement.dataset.theme = th;
// Links from other pages: #Vorurteil, or UTF-8 bytes as ~XX (#gew~C3~A4hrleisten), or %XX.
function openHash() {
  let h = location.hash.slice(1); if (!h) return false;
  try { h = decodeURIComponent(h.replace(/~([0-9A-Fa-f]{2})/g, '%$1')).trim(); } catch { return false; }
  if (!h) return false;
  if (byKey.get(h)) { q.value = ''; current = null; open(h); return true; }
  const r = search(h);
  if (r.length && fold(r[0].w) === fold(h)) { q.value = ''; current = null; open(keyOf(r[0])); return true; }
  // not a headword: show the search results for it (an inflected form gets its hint there)
  q.value = h; current = null; tab = 'search'; render(); return true;
}
window.addEventListener('hashchange', () => { if (INDEX.length) openHash(); });
load().then(() => { if (!openHash()) render(); });
})();
</script>

t": "Hörtext 3", "q": "Was bedeutet „kognitives Auslagern“?", "a": "Informationen nicht im Kopf speichern, sondern extern (Handy/Notizbuch), wo man sie jederzeit wiederfindet."}, {"k": "s3_1", "n": 20, "part": "Hörtext 3", "q": "Was zeigte das Experiment mit dem Abtippen über die Personen, die an Speicherung glaubten? (zwei Ergebnisse)", "a": "Sie erinnerten sich schlechter an den Inhalt, wussten aber gut, wo (in welchem Ordner) die Texte lagen."}, {"k": "s3_2", "n": 21, "part": "Hörtext 3", "q": "Warum ist Wissen im eigenen Kopf für das Lernen wichtig?", "a": "Nur im Kopf kann Wissen mit anderem Wissen verknüpft werden (Verstehen, Kreativität)."}, {"k": "s3_3", "n": 22, "part": "Hörtext 3", "q": "Wo lag das Handy der Studierenden, die in der Studie am besten abschnitten?", "a": "Im Nebenraum (in einem anderen Raum)."}, {"k": "s3_4", "n": 23, "part": "Hörtext 3", "q": "Wie erklärt Brandl dieses Ergebnis?", "a": "Schon die Anwesenheit des Handys bindet Aufmerksamkeit, weil man ständig unterdrücken muss, nachzusehen."}, {"k": "s3_5", "n": 24, "part": "Hörtext 3", "q": "Welche Lernmethode hält Brandl für besonders wirksam?", "a": "Sich selbst abfragen / Wissen aus dem Gedächtnis abrufen (statt wiederholt lesen)."}, {"k": "s3_6", "n": 25, "part": "Hörtext 3", "q": "Mit welchem Vergleich beschreibt Brandl das Gehirn am Ende?", "a": "Es ist keine Festplatte, die voll wird, sondern ein Muskel, der trainiert werden will."}]};
const API=/pages\.dev$/.test(location.hostname)?'/api':'https://deutsch-lernen-1ca.pages.dev/api';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let key=''; try{ key=sessionStorage.getItem('td-key')||''; }catch(e){}
const kind=()=>{ const k=location.hash.slice(1); return QS[k]?k:'papier-1'; };
const ksel=document.getElementById('kindSel'); ksel.innerHTML=Object.keys(QS).map((k,i)=>`<option value="${k}">纸笔版 第 ${i+1} 套${i?'（较难）':''}</option>`).join(''); ksel.addEventListener('change',()=>{ location.hash=ksel.value; });
async function load(){
  const k=kind(); ksel.value=k;
  const ex=document.getElementById('examOnly').checked;
  let s; try{ const r=await fetch(`${API}/testdaf/stats?kind=${k}${ex?'&mode=exam':''}${key?'&key='+encodeURIComponent(key):''}`); s=await r.json(); if(!r.ok) throw new Error(s.error); }
  catch(e){ document.getElementById('kpis').innerHTML=`<p class="mute">统计暂时加载不了：${esc(e.message||'网络错误')}</p>`; return; }
  const T=s.total||25;
  document.getElementById('kpis').innerHTML=[[s.n,'次交卷'],[s.people,'人（按浏览器）'],[s.n?s.avg.toFixed(1)+' / '+T:'—','平均分'],[s.n?Math.round(s.avg/T*100)+'%':'—','平均正确率'],[s.parts.length?s.parts.map(x=>x.toFixed(1)).join(' / '):'—','H1 / H2 / H3 平均']].map(([b,t])=>`<div class="kpi"><b>${b}</b><span>${t}</span></div>`).join('');
  const max=Math.max(1,...Object.values(s.dist));
  document.getElementById('dist').innerHTML=Array.from({length:T+1},(_,i)=>`<div title="${i} 分：${s.dist[i]||0} 次" style="height:${(s.dist[i]||0)/max*100}%"></div>`).join('');
  document.getElementById('axis').innerHTML=`<span>0</span><span>${Math.round(T/2)}</span><span>${T}</span>`;
  document.getElementById('rows').innerHTML=QS[k].map(q=>{ const c=s.q[q.k]; const p=c?c[0]/c[1]:null; const col=p==null?'var(--line)':p>=.7?'var(--ok)':p>=.4?'var(--warn)':'var(--bad)';
    const w=s.wrong&&s.wrong[q.k]?`<div class="wrong">常见错答：${s.wrong[q.k].map(([v,n])=>esc(v)+'（'+n+'）').join('；')}</div>`:'';
    return `<tr><td>${q.n}</td><td>${esc(q.q)}<div class="ans">${esc(q.part)} · 答案：${esc(q.a)}</div>${w}</td><td class="pct">${p==null?'—':Math.round(p*100)+'%'} <span class="mute" style="font-size:12px">${c?c[0]+'/'+c[1]:''}</span><div class="meter"><i style="width:${p==null?0:p*100}%;background:${col}"></i></div></td></tr>`; }).join('');
  document.getElementById('kmsg').textContent= key ? (s.admin?'已显示错误答案':'密钥不对，或服务器上还没设置密钥') : '';
}
document.getElementById('kf').addEventListener('submit',e=>{ e.preventDefault(); key=document.getElementById('key').value.trim(); try{ sessionStorage.setItem('td-key',key); }catch(_){} load(); });
document.getElementById('examOnly').addEventListener('change',load);
window.addEventListener('hashchange',load);
load();
</script></body></html>

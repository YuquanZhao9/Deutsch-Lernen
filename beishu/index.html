<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>教学工作台</title>
<meta name="theme-color" content="#17855a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="教学工作台">
<meta name="format-detection" content="telephone=no">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script src="../konto/sync.js"></script>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: teacher workbench. Desktop = sticky top bar + left nav grouped by job (教学工具/学情分析/学生管理/班级常规) + content.
   Phone = top bar with drawer nav; check-in views keep a bottom "status brush" dock. Mint ground, deep green accent, warm marker for highlights. */
:root {
  --bg: #f1f7f3;
  --surface: #ffffff;
  --surface-2: #e5f1ea;
  --line: #d2e2d8;
  --fg: #15231c;
  --muted: #5d7066;
  --accent: #17855a;
  --accent-fg: #ffffff;
  --accent-soft: #d5efe1;
  --marker: #f2b33d;
  --done: #2f8a4c;  --done-bg: #dcf1e1;
  --weak: #b7791f;  --weak-bg: #fbedd0;
  --fail: #c9423b;  --fail-bg: #f9dcd9;
  --redo: #2f6db5;  --redo-bg: #dbe7f7;
  --leave: #6f7681; --leave-bg: #e6e8eb;
  --shadow: 0 1px 2px rgba(20,60,40,.06), 0 6px 18px rgba(20,60,40,.06);
  --f-display: "ZCOOL XiaoWei", "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-body: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --f-num: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --r: 14px;
  --side-w: 220px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1613; --surface: #17201c; --surface-2: #1f2b25; --line: #2f3f37;
  --fg: #e4eee8; --muted: #93a69c; --accent: #5ccf9b; --accent-fg: #082016; --accent-soft: #1b3a2c; --marker: #e6a93a;
  --done: #5cc07a; --done-bg: #1c3824; --weak: #e2a84a; --weak-bg: #3b2e14;
  --fail: #ef7a72; --fail-bg: #43201e; --redo: #77a9ec; --redo-bg: #1d2f48;
  --leave: #a3aab4; --leave-bg: #2b3035; --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1613; --surface: #17201c; --surface-2: #1f2b25; --line: #2f3f37;
  --fg: #e4eee8; --muted: #93a69c; --accent: #5ccf9b; --accent-fg: #082016; --accent-soft: #1b3a2c; --marker: #e6a93a;
  --done: #5cc07a; --done-bg: #1c3824; --weak: #e2a84a; --weak-bg: #3b2e14;
  --fail: #ef7a72; --fail-bg: #43201e; --redo: #77a9ec; --redo-bg: #1d2f48;
  --leave: #a3aab4; --leave-bg: #2b3035; --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { padding-block: 9px; display: grid; gap: 9px; max-width: 1280px; margin: 0 auto; }
.row1 { display: flex; align-items: center; gap: 8px; }
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.logo { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; flex: none; }
.logo svg { width: 19px; height: 19px; }
.brand b { font-family: var(--f-display); font-size: 19px; letter-spacing: .04em; white-space: nowrap; font-weight: 700; }
.brand > span:last-child { min-width: 0; }
.brand small { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small.warn { color: var(--fail); text-decoration: underline; cursor: pointer; }
.brand small.ok { color: var(--done); }
.spacer { flex: 1; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; height: 36px; padding: 0 11px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap; }
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 17px; height: 17px; flex: none; }
.icon-btn[disabled] { opacity: .4; }
.icon-btn.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.primary { background: var(--accent) !important; color: var(--accent-fg) !important; border-color: var(--accent) !important; font-weight: 600; }
.hamb { display: none; }
@media (max-width: 440px) { .row1 .icon-btn .lbl { display: none; } .row1 .icon-btn { padding: 0 9px; } }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface-2); border-radius: 11px; padding: 3px; gap: 3px; }
.tab { border: 0; background: transparent; border-radius: 9px; padding: 7px 4px; font-weight: 600; font-size: 14px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .pct { display: block; font-weight: 400; font-size: 11px; font-family: var(--f-num); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }

/* shell */
.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); max-width: 1280px; margin: 0 auto; }
aside.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 112px); align-self: start; max-height: calc(100vh - 120px); overflow-y: auto; padding: 14px 10px 30px 16px; display: grid; gap: 2px; }
.side h4 { margin: 12px 10px 4px; font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: .1em; }
.nav { display: flex; align-items: center; gap: 10px; border: 0; background: none; border-radius: 10px; padding: 8px 10px; text-align: left; font-size: 14.5px; color: var(--fg); width: 100%; }
.nav svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.nav:hover { background: var(--surface-2); }
.nav[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav[aria-current="page"] svg { color: var(--accent); }
.nav .badge { margin-left: auto; font-size: 11px; font-family: var(--f-num); background: var(--fail); color: #fff; border-radius: 99px; padding: 0 6px; }
main.view { min-width: 0; padding-block: 16px 160px; display: grid; gap: 16px; align-content: start; }
@media (max-width: 899px) {
  .shell { display: block; }
  .hamb { display: inline-flex; }
  aside.side { position: fixed; z-index: 45; top: 0; bottom: 0; left: 0; width: min(280px, 82vw); max-height: none; background: var(--surface); box-shadow: 0 0 40px rgba(0,0,0,.25);
    transform: translateX(-105%); transition: transform .2s; padding-top: calc(env(safe-area-inset-top, 0px) + 14px); padding-left: max(14px, env(safe-area-inset-left, 0px)); align-content: start; }
  aside.side.open { transform: none; }
  .side-scrim { position: fixed; inset: 0; z-index: 44; background: rgba(10,25,18,.4); }
}
@media (min-width: 900px) { .side-scrim { display: none !important; } main.view { padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-left: 8px; } }

/* page head */
.page-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-family: var(--f-display); font-size: 26px; line-height: 1.15; letter-spacing: .03em; font-weight: 700; text-wrap: balance; }
.page-head h1 em { font-style: normal; background: linear-gradient(transparent 62%, color-mix(in srgb, var(--marker) 55%, transparent) 62%); }
.page-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; min-width: 0; }
.card h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.card h3 svg { width: 18px; height: 18px; color: var(--accent); }
.card h3 .spacer { flex: 1; }
.card h3 .tag { font-size: 11.5px; font-weight: 600; color: var(--fail); background: var(--fail-bg); border-radius: 99px; padding: 1px 8px; }
.cols { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); align-items: start; }

/* overview */
.hero { background: linear-gradient(120deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 70%, #0b3d2a) 100%); color: var(--accent-fg); border-radius: var(--r); padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 13.5px; }
.hero b { font-family: var(--f-num); font-size: 15px; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
@media (max-width: 420px) { .stats { grid-template-columns: 1fr 1fr; } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 2px; text-align: left; }
.stat .k { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.stat .k svg { width: 15px; height: 15px; }
.stat .v { font-family: var(--f-num); font-size: 26px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 14px; color: var(--muted); font-weight: 500; }
.stat.alert .v { color: var(--fail); }
.quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.qt { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 12px 6px 10px; display: grid; justify-items: center; gap: 6px; font-size: 13px; }
.qt svg { width: 24px; height: 24px; color: var(--accent); }
.qt:active { transform: scale(.97); }
.todo-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--line); }
.todo-row:first-child { border-top: 0; }
.todo-row input[type=checkbox] { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
.todo-row .tx { flex: 1; min-width: 0; word-break: break-word; }
.todo-row .tx.done { text-decoration: line-through; color: var(--muted); }
.todo-row .due { font-size: 12px; font-family: var(--f-num); color: var(--muted); white-space: nowrap; }
.todo-row .due.late { color: var(--fail); font-weight: 600; }
.todo-row .go { border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 3px 9px; font-size: 12.5px; white-space: nowrap; }
.muted { color: var(--muted); font-size: 13px; margin: 0; }
.qadd { width: 100%; border: 1px dashed var(--line); border-radius: 10px; background: var(--bg); padding: 8px 10px; }

/* check views (读背/考勤) */
.datebar { display: flex; align-items: center; gap: 6px; }
.datebar input[type=date] { flex: 1; min-width: 0; height: 38px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 10px; font-family: var(--f-num); font-size: 15px; max-width: 220px; }
.weekday { font-size: 13px; color: var(--muted); min-width: 2.6em; text-align: center; }
.label { font-size: 12px; letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.label .spacer { flex: 1; }
.link-btn { border: 0; background: none; color: var(--accent); font-size: 13px; padding: 2px 0; }
.content-input { width: 100%; border: 0; border-bottom: 2px solid var(--line); background: transparent; padding: 4px 0 6px; font-family: var(--f-display); font-size: 22px; font-weight: 700; }
.content-input:focus { outline: none; border-bottom-color: var(--accent); }
.content-input::placeholder { color: var(--muted); font-weight: 400; opacity: .7; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 11px; font-size: 13px; white-space: nowrap; }
.chip.last { border-color: var(--accent); color: var(--accent); }
.chip.edit { background: transparent; border-style: dashed; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); display: flex; overflow: hidden; }
.bar span { display: block; height: 100%; transition: width .25s; }
.counts { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.counts b { font-family: var(--f-num); color: var(--fg); font-weight: 600; margin-left: 3px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
.toolrow { display: flex; flex-wrap: wrap; gap: 8px; }
.toolrow .icon-btn { height: 34px; font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.stu { position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: 11px; min-height: 64px; padding: 8px 8px 7px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 2px; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; transition: transform .08s; }
.stu:active { transform: scale(.97); }
.stu .no { font-family: var(--f-num); font-size: 11px; color: var(--muted); }
.stu .nm { font-size: 16px; font-weight: 600; line-height: 1.2; word-break: break-all; }
.stu .st { font-size: 12px; font-weight: 600; min-height: 1.2em; }
.stu .pts { position: absolute; top: 6px; right: 8px; font-family: var(--f-num); font-size: 12px; font-weight: 700; color: var(--accent); }
.stu .pts.neg { color: var(--fail); }
.stu .note-flag { position: absolute; top: 7px; right: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.stu[data-c="done"]  { background: var(--done-bg);  border-color: var(--done); }  .stu[data-c="done"] .st  { color: var(--done); }
.stu[data-c="weak"]  { background: var(--weak-bg);  border-color: var(--weak); }  .stu[data-c="weak"] .st  { color: var(--weak); }
.stu[data-c="fail"]  { background: var(--fail-bg);  border-color: var(--fail); }  .stu[data-c="fail"] .st  { color: var(--fail); }
.stu[data-c="redo"]  { background: var(--redo-bg);  border-color: var(--redo); }  .stu[data-c="redo"] .st  { color: var(--redo); }
.stu[data-c="leave"] { background: var(--leave-bg); border-color: var(--leave); } .stu[data-c="leave"] .st { color: var(--leave); }
.stu.sel { outline: 3px solid var(--accent); outline-offset: -1px; }
.stu.sel::after { content: "✓"; position: absolute; bottom: 6px; right: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-size: 12px; display: grid; place-items: center; }
.empty { text-align: center; padding: 26px 10px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }
.example-tag { font-size: 12px; color: var(--weak); background: var(--weak-bg); border-radius: 6px; padding: 2px 8px; justify-self: start; }

/* bottom dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -4px 18px rgba(0,0,0,.06); }
.dock-in { padding-block: 8px; display: grid; gap: 7px; max-width: 820px; margin: 0 auto; }
.dock-hint { font-size: 12px; color: var(--muted); min-height: 18px; min-width: 0; }
.brushes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
.brush { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 2px 6px; font-size: 13px; font-weight: 600; display: grid; justify-items: center; gap: 2px; min-width: 0; }
.brush i { font-style: normal; font-size: 16px; line-height: 1; }
.brush[data-c="done"] i { color: var(--done); } .brush[data-c="weak"] i { color: var(--weak); }
.brush[data-c="fail"] i { color: var(--fail); } .brush[data-c="redo"] i { color: var(--redo); }
.brush[data-c="leave"] i { color: var(--leave); } .brush[data-c=""] i { color: var(--muted); }
.brush[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.apply-row { display: flex; gap: 8px; }
.apply-row .icon-btn { flex: 1; justify-content: center; }
.apply-row .icon-btn.primary { flex: 2; }

/* rollcall */
.roll { text-align: center; padding: 26px 14px; display: grid; gap: 12px; justify-items: center; background: radial-gradient(circle at 50% 0%, var(--accent-soft), var(--surface) 70%); }
.roll .big { font-family: var(--f-display); font-size: clamp(40px, 12vw, 72px); font-weight: 700; letter-spacing: .08em; line-height: 1.1; min-height: 1.1em; word-break: break-all; }
.roll .big.spin { color: var(--muted); }
.roll .sub { color: var(--muted); font-size: 13px; }
.roll .go-btn { height: 48px; padding: 0 30px; font-size: 17px; border-radius: 99px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 12px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); }

/* tables & lists */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table.tbl { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.tbl th { background: var(--surface-2); font-weight: 600; font-size: 12.5px; color: var(--muted); }
.tbl td.num, .tbl th.num { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--surface-2); }
.tt input { width: 100%; min-width: 72px; border: 0; background: transparent; padding: 9px 4px; text-align: center; }
.tt td { padding: 0; border-right: 1px solid var(--line); }
.tt th.today, .tt td.today { background: var(--accent-soft); }
.list { display: grid; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.list > * { padding: 10px 12px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; background: var(--surface); text-align: left; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; min-width: 0; }
.list > *:first-child { border-top: 0; }
.list .d { font-family: var(--f-num); font-size: 13px; color: var(--muted); white-space: nowrap; }
.list .c { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .n { font-family: var(--f-num); font-size: 13px; white-space: nowrap; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.pill[data-c="done"] { background: var(--done-bg); color: var(--done); } .pill[data-c="weak"] { background: var(--weak-bg); color: var(--weak); }
.pill[data-c="fail"] { background: var(--fail-bg); color: var(--fail); } .pill[data-c="redo"] { background: var(--redo-bg); color: var(--redo); }
.pill[data-c="leave"] { background: var(--leave-bg); color: var(--leave); } .pill[data-c=""] { background: var(--surface-2); color: var(--muted); }
.dist { display: grid; gap: 5px; }
.dist-row { display: grid; grid-template-columns: 5.5em 1fr 2.5em; gap: 8px; align-items: center; font-size: 12.5px; }
.dist-row .tr { height: 12px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.dist-row .tr span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.dist-row .n { font-family: var(--f-num); text-align: right; }
.score-row { display: grid; grid-template-columns: 2.4em 1fr 6.5em; gap: 8px; align-items: center; padding: 4px 0; border-top: 1px dashed var(--line); }

  if (undoStack.length > 40) undoStack.shift();

function undo() {

  else { const store = S[MODS[u.what.mod].store], k = rkey(u.cid, u.date); if (u.data) store[k] = JSON.parse(u.data); else delete store[k]; S.date = u.date; }

}

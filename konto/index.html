<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>账号 · Deutsch lernen</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="theme-color" content="#f2c200">
<style>
:root{--bg:#f7f5ef;--card:#fff;--ink:#1d1d1b;--muted:#6b6a64;--line:#e4e1d8;--accent:#f2c200;--accent-ink:#1d1d1b;--err:#b3261e;--ok:#1e7a3c;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#161614;--card:#21211e;--ink:#f1efe8;--muted:#a3a198;--line:#34332f;--accent:#f2c200;--accent-ink:#1d1d1b;--err:#ff8a80;--ok:#7ad59a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;justify-content:center}
.wrap{width:100%;max-width:400px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0 0 4px}
.brand .tag{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 6px;font-size:15px;vertical-align:2px;margin-left:4px}
.lead{color:var(--muted);margin:0 0 20px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:15px;padding:8px 0;border-radius:7px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.row{display:flex;gap:8px}.row input{flex:1;min-width:0}
.btn{display:block;width:100%;text-align:center;text-decoration:none;margin-top:18px;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn.small{display:inline-block;width:auto;margin:0;padding:10px 14px;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:default}
.msg{margin:14px 0 0;font-size:14px;min-height:1px}.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.link{background:none;border:0;padding:0;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;margin-top:14px}
.note{font-size:13px;color:var(--muted);margin:14px 0 0}
.me{font-size:15px;margin:0 0 4px}.me b{word-break:break-all}
.nav{display:flex;gap:8px;margin-top:16px}.nav a{flex:1;text-align:center;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 0;background:var(--card);font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <p class="brand">Deutsch <span class="tag">lernen</span></p>
  <p class="lead">注册后，每日学习的进度、打卡记录、生词本和词典的收藏会保存在你的账号里，手机和电脑登录同一个账号就能同步。</p>

  <div class="card" id="out">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="login" aria-selected="true">登录</button>
      <button role="tab" data-tab="register" aria-selected="false">注册</button>
    </div>

    <form id="f-login" data-form="login">
      <label for="l-email">邮箱</label><input id="l-email" name="email" type="email" autocomplete="username" required>
      <label for="l-pw">密码</label><input id="l-pw" name="password" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">登录</button>
      <button class="link" type="button" data-tab="reset">忘记密码？</button>
    </form>

    <form id="f-register" data-form="register" hidden>
      <label for="r-email">邮箱</label><input id="r-email" name="email" type="email" autocomplete="username" required>
      <label for="r-pw">密码（至少 8 位）</label><input id="r-pw" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="r-pw2">再输一次密码</label><input id="r-pw2" name="password2" type="password" autocomplete="new-password" minlength="8" required>
      <button class="btn" type="submit">注册</button>
      <p class="note">请填常用邮箱，忘记密码时验证码会发到这里。这台设备上已有的学习记录会一起存进新账号。</p>
    </form>

    <form id="f-reset" data-form="reset" hidden>
      <p class="me" style="font-weight:600">重设密码</p>
      <label for="p-email">注册时用的邮箱</label>
      <div class="row"><input id="p-email" name="email" type="email" autocomplete="username" required><button class="btn small" type="button" id="send-code">发送验证码</button></div>
      <label for="p-code">邮件里的 6 位验证码</label><input id="p-code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
      <label for="p-pw">新密码（至少 8 位）</label><input id="p-pw" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <button class="btn" type="submit">重设并登录</button>
      <button class="link" type="button" data-tab="login">返回登录</button>
      <p class="note">没收到邮件的话，看看垃圾邮件文件夹。</p>
    </form>
    <p class="msg" id="msg" role="status"></p>
  </div>

  <div class="card" id="in" hidden>
    <p class="me">已登录：<b id="me"></b></p>
    <p class="note" id="sync-state" style="margin-top:0"></p>
    <a class="btn" id="back" href="../">继续学习</a>
    <details style="margin-top:18px">
      <summary style="cursor:pointer;color:var(--muted);font-size:14px">修改密码</summary>
      <form data-form="password">
        <label for="c-old">原密码</label><input id="c-old" name="old" type="password" autocomplete="current-password" required>
        <label for="c-pw">新密码（至少 8 位）</label><input id="c-pw" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <button class="btn ghost" type="submit">修改密码</button>
        <p class="note">修改后，其他设备需要重新登录。</p>
      </form>
    </details>
    <button class="btn ghost" id="logout" type="button">退出登录</button>
    <p class="note">退出后，这台设备上的学习记录会被清除，账号里的记录不受影响，再次登录即可恢复。</p>
    <p class="msg" id="msg2" role="status"></p>
  </div>

  <div class="nav"><a href="../taeglich/">每日学习</a><a href="../woerterbuch/">词典</a></div>
</div>

<script src="sync.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const S = window.DLSync;
  const next = (() => {
    const n = new URLSearchParams(location.search).get('next');
    return n && n.startsWith('/') && !n.startsWith('//') && !/\/konto\/?$/.test(n.split('?')[0]) ? n : null;
  })();
  if (next) $('#back').href = next;

  const say = (t, kind, el = '#msg') => { const m = $(el); m.textContent = t || ''; m.className = 'msg ' + (kind || ''); };
  function tab(name) {
    for (const b of document.querySelectorAll('.tabs button')) b.setAttribute('aria-selected', b.dataset.tab === name);
    for (const f of ['login', 'register', 'reset']) $('#f-' + f).hidden = f !== name;
    const email = ($('#f-login').email.value || $('#f-register').email.value || $('#p-email').value).trim();
    if (email) for (const id of ['#l-email', '#r-email', '#p-email']) if (!$(id).value) $(id).value = email;
    say('');
  }
  document.addEventListener('click', e => { const t = e.target.closest('[data-tab]'); if (t) tab(t.dataset.tab); });

  const STATES = { syncing: '正在同步…', ok: '记录已同步。', offline: '暂时连不上服务器，记录先保存在本机，联网后会自动同步。', error: '同步出了问题，稍后会再试。', idle: '' };
  function show() {
    const u = S.user();
    $('#out').hidden = !!u; $('#in').hidden = !u;
    if (u) { $('#me').textContent = u; $('#sync-state').textContent = STATES[S.state()] || ''; }
  }
  S.onChange(show);

  async function busy(form, fn) {
    const btns = form.querySelectorAll('button'); btns.forEach(b => b.disabled = true);
    try { await fn(); } catch (e) { say(e.message, 'err', form.closest('#in') ? '#msg2' : '#msg'); }
    finally { btns.forEach(b => b.disabled = false); }
  }
  const done = () => { if (next) location.href = next; else { show(); S.pull(); } };

  document.addEventListener('submit', e => {
    const f = e.target; e.preventDefault();
    const v = n => (f[n] && f[n].value || '').trim();
    busy(f, async () => {
      if (f.dataset.form === 'login') { await S.login(v('email'), f.password.value); done(); }
      if (f.dataset.form === 'register') {
        if (f.password.value !== f.password2.value) throw new Error('两次输入的密码不一样');
        await S.register(v('email'), f.password.value); done();
      }
      if (f.dataset.form === 'reset') { await S.confirmReset(v('email'), v('code'), f.password.value); done(); }
      if (f.dataset.form === 'password') { await S.changePassword(f.old.value, f.password.value); f.reset(); say('密码已修改。', 'ok', '#msg2'); }
    });
  });

  let cool = 0;
  $('#send-code').addEventListener('click', () => {
    const f = $('#f-reset'), email = $('#p-email').value.trim();
    if (!email) { say('先填邮箱', 'err'); return; }
    busy(f, async () => {
      await S.requestReset(email);
      say('验证码已发到 ' + email + '，15 分钟内有效。', 'ok');
      $('#p-code').focus();
      cool = 60;
      const b = $('#send-code'), t = setInterval(() => {
        b.textContent = --cool > 0 ? cool + ' 秒后重发' : '重新发送'; b.disabled = cool > 0;
        if (cool <= 0) clearInterval(t);
      }, 1000);
    }).then(() => { if (cool > 0) $('#send-code').disabled = true; });
  });

  $('#logout').addEventListener('click', async () => {
    if (!confirm('退出后，这台设备上的学习记录会被清除（账号里的不受影响）。确定退出？')) return;
    await S.logout(); show(); tab('login');
  });

  show();
})();
</script>
</body>
</html>

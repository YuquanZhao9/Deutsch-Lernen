<!doctype html><html lang="zh-CN"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#f2c200">

<title>Deutsch täglich</title>
<link rel="stylesheet" href="../fonts/bab05cd78a.css">
<style>
/* Layout: Reclam-yellow study booklet. Desktop = left rail + card/detail columns; phone = top bar + bottom tab bar, one column. */
:root{
  --bg:#f6f4ee; --paper:#fffdf7; --ink:#1d1f24; --muted:#6a6a64; --line:#e3dfd2;
  --accent:#f2c200; --accent-ink:#2a2300; --accent-soft:#fbefb8;
  --der:#2f62c9; --die:#c8363a; --das:#2f8a4e;
  --good:#2f8a4e; --warn:#b97900; --bad:#c8363a;
  --display:"Zilla Slab", Georgia, "Songti SC", serif;
  --read:"Source Serif 4", Georgia, "Songti SC", "Noto Serif SC", serif;
  --ui:"IBM Plex Sans", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --r:10px; --tabh:59px; --mtop-h:44px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15161a; --paper:#1d1f24; --ink:#ecebe6; --muted:#9a9a92; --line:#2e3037;
  --accent:#f2c200; --accent-ink:#1d1a05; --accent-soft:#3a3214;
  --der:#7aa2f2; --die:#f07a7d; --das:#6cc48d;
  --good:#6cc48d; --warn:#e3b34a; --bad:#f07a7d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15161a; --paper:#1d1f24; --ink:#ecebe6; --muted:#9a9a92; --line:#2e3037;
  --accent:#f2c200; --accent-ink:#1d1a05; --accent-soft:#3a3214;
  --der:#7aa2f2; --die:#f07a7d; --das:#6cc48d;
  --good:#6cc48d; --warn:#e3b34a; --bad:#f07a7d; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;box-sizing:border-box;padding:24px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;background:var(--paper)}
.brand{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;display:flex;flex-direction:column;gap:2px}
.brand small{font-family:var(--ui);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em}
.brand .tag{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:0 6px;border-radius:3px}
.tabs{display:flex;flex-direction:column;gap:4px}
.tab{display:flex;align-items:center;gap:10px;padding:9px 12px;border:0;background:none;border-radius:8px;text-align:left;font-weight:500;color:var(--muted)}
.tab svg{width:18px;height:18px;flex:none}
.tab[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.tab .badge{margin-left:auto;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.sync{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)}
main{padding-inline:32px;padding-block:28px 48px;min-width:0}
.view{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h1{margin:0;font-family:var(--display);font-size:30px;font-weight:600;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--paper);padding:9px 16px;border-radius:8px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.notice{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:14px 16px;color:var(--muted)}
.notice.err{border-color:var(--bad);color:var(--bad)}
/* progress */
.prog{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .k{background:var(--good)} .bar .f{background:var(--warn)} .bar .u{background:var(--bad)}
/* word study */
.study{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px)}
.card .num{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.word-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.art{font-family:var(--display);font-size:22px;font-weight:600}
.art.der{color:var(--der)} .art.die{color:var(--die)} .art.das{color:var(--das)}
.card{container-type:inline-size}
.lemma{font-family:var(--display);font-size:clamp(28px,12cqi,44px);font-weight:700;line-height:1.05;word-break:break-word;hyphens:auto}
.speak{border:1px solid var(--line);background:none;border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;align-self:center}
.speak svg{width:18px;height:18px}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.ask{font-size:14px;color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.choice{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 8px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.choice small{font-weight:400;font-size:12px;color:var(--muted)}
.choice.k:hover,.choice.k.sel{border-color:var(--good);color:var(--good)}
.choice.f:hover,.choice.f.sel{border-color:var(--warn);color:var(--warn)}
.choice.u:hover,.choice.u.sel{border-color:var(--bad);color:var(--bad)}
.navrow{display:flex;gap:8px;justify-content:space-between}
.quick{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.quick .mean{font-size:18px;font-weight:600}
.linkish{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;font-size:13px;align-self:flex-start}
.detail{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sec h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:baseline}
.sec h3 span{font-family:var(--display);text-transform:none;letter-spacing:0;font-size:16px;color:var(--ink)}
.sec p{margin:0}
.big-mean{font-size:20px;font-weight:600}
.ex{display:flex;flex-direction:column;gap:2px;padding-left:12px;border-left:2px solid var(--accent)}
.ex .de{font-family:var(--read);font-size:16px}
.ex .zh{color:var(--muted);font-size:14px}
.parts{display:flex;flex-wrap:wrap;gap:8px}
.part{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
.part b{font-family:var(--display);font-size:18px}
.part span{font-size:13px;color:var(--muted)}
.ety{font-family:var(--read);font-size:15.5px;line-height:1.7}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
.chain .st{background:var(--accent-soft);border-radius:6px;padding:2px 8px}
.chain .st em{color:var(--muted);font-style:normal;margin-right:4px}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 16px}
.pairs div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;min-width:0}
.pairs b{font-weight:600}
.pairs span{color:var(--muted);font-size:14px}
.tip{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;font-size:14px}
.dictlink{margin-left:auto;align-self:center;display:inline-flex;align-items:center;gap:5px;flex:none;font-family:var(--ui);font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 11px;background:var(--paper)}
.dictlink:hover{border-color:var(--accent);background:var(--accent-soft)}
.dictlink svg{width:12px;height:12px}
.pop-a .dictlink{margin-left:0;padding:5px 12px}
.lvl{font-style:normal;font-family:var(--ui);font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;align-self:center}
.senses{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:sn}
.senses li{display:grid;gap:3px;min-width:0}
.senses.multi li{position:relative;padding-left:28px;counter-increment:sn}
.senses.multi li::before{content:counter(sn);position:absolute;left:0;top:3px;width:19px;height:19px;border-radius:50%;background:var(--accent-soft);color:var(--ink);font-size:12px;font-weight:600;display:grid;place-items:center}
.s-zh{font-size:18px;font-weight:600;line-height:1.45}
.senses:not(.multi) .s-zh{font-size:20px}
.s-de{font-family:var(--read);font-size:15.5px;color:var(--muted);font-style:italic}
.tip.note{background:transparent;border:1px dashed var(--line)}
.skeleton{color:var(--muted);font-size:14px}
.empty-detail{border:1px dashed var(--line);border-radius:var(--r);padding:28px 22px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.empty-detail b{color:var(--ink);font-family:var(--display);font-size:18px}
/* detail section nav: sticky chips that jump to 词意 / 用法 / 词根 / 词源 */
.secnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);display:flex;align-items:center;gap:6px;padding-block:10px}
.secnav .sw{font-family:var(--display);font-size:19px;font-weight:600;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.secnav .sw .art{font-size:15px;margin-right:4px}
.secnav button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 13px;font-size:13px;color:var(--muted)}
.secnav button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sec{scroll-margin-top:62px}
/* 30-word map on the card (desktop) */
.wmap{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:5px;border-top:1px dashed var(--line);padding-top:14px}
.wmap button{aspect-ratio:1;max-width:100%;border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:0}
.wmap button.k{background:var(--good);border-color:var(--good)}
.wmap button.f{background:var(--warn);border-color:var(--warn)}
.wmap button.u{background:var(--bad);border-color:var(--bad)}
.wmap button[aria-current="true"]{outline:2px solid var(--ink);outline-offset:1px}
@keyframes inNx{from{opacity:0;transform:translateX(28px)}}
@keyframes inPv{from{opacity:0;transform:translateX(-28px)}}
.card.nx{animation:inNx .2s ease-out} .card.pv{animation:inPv .2s ease-out}
@media (prefers-reduced-motion: reduce){.card.nx,.card.pv{animation:none}}
/* phone-only answer dock and reading tabs (hidden on desktop by .only-m) */
.dock{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:6;display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr)) auto;gap:6px;padding:8px 12px;background:color-mix(in srgb,var(--paper) 94%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.dk{height:46px;min-width:46px;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-weight:600;font-size:15px;padding:0 10px}
.dk.nav{font-size:24px;font-weight:500;line-height:1;padding:0 12px}
.dk.nav.txt{font-size:15px;font-weight:600}
.dk.nav.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dk:disabled{opacity:.35;cursor:default}
.dk.k.sel{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 13%,var(--paper))}
.dk.f.sel{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,var(--paper))}
.dk.u.sel{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--paper))}
.dock-sp{height:62px}
.rseg{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--mtop-h));z-index:3;background:var(--bg);padding-block:8px;display:grid;grid-template-columns:1fr 1fr}
.rseg button{border:1px solid var(--line);background:var(--paper);padding:9px 8px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.rseg button:first-child{border-radius:10px 0 0 10px} .rseg button:last-child{border-radius:0 10px 10px 0;border-left:0}
.rseg button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.to-q{align-self:stretch;margin-top:6px}
/* new words / review switch (both layouts) */
.wseg{position:static;max-width:440px;padding-block:0}
.nextrev{margin:0;font-size:13px;color:var(--muted)}
.nextrev b{color:var(--ink);font-weight:600}
.srcday{color:var(--muted)}
@media (min-width: 821px){.only-m{display:none !important}}
/* done summary */
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat b{display:block;font-family:var(--display);font-size:32px;font-variant-numeric:tabular-nums}
.stat.k b{color:var(--good)} .stat.f b{color:var(--warn)} .stat.u b{color:var(--bad)}
.wlist{display:flex;flex-wrap:wrap;gap:6px}
.wpill{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px;font-size:14px}
.wpill.f{border-color:var(--warn)} .wpill.u{border-color:var(--bad)}
/* reading */
.reading{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width: 1150px){.reading{grid-template-columns:minmax(0,1fr)} .article{position:static !important;max-height:none !important;overflow:visible !important}}
.article{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);max-height:calc(100vh - 40px);overflow:auto;overscroll-behavior:contain;container-type:inline-size;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:28px 30px;display:flex;flex-direction:column;gap:14px}
.article h2{margin:0;font-family:var(--display);font-size:28px;font-weight:600;text-wrap:balance}
.article .para{font-family:var(--read);font-size:17.5px;line-height:1.75;max-width:65ch}
.article .para p{margin:0}
.article .tr{font-family:var(--ui);font-size:14px;color:var(--muted);margin-top:4px}
.article mark,.tk.tw{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 2px}
/* reading: tap a word, select to highlight, German margin glosses (Deutsch perfekt style) */
.abody{position:relative;display:flex;flex-direction:column;gap:14px}
.tk{cursor:pointer;border-radius:3px}
@media (hover:hover){.tk:hover{background:var(--line)}}
.tk.on{outline:2px solid var(--accent);outline-offset:1px}
.hl{background:linear-gradient(transparent 52%, color-mix(in srgb,var(--accent) 55%,transparent) 52%)}
.tk.tw.hl{background:linear-gradient(var(--accent-soft) 52%, color-mix(in srgb,var(--accent) 60%,transparent) 52%)}
.gn{font-family:var(--ui);font-size:.6em;font-weight:600;color:var(--die);margin-left:1px;line-height:0;cursor:pointer}
.nt{font-size:.7em;color:var(--warn);cursor:pointer;margin-left:1px;line-height:0}
.gl{font-family:var(--ui);font-size:12.5px;line-height:1.45;color:var(--muted);display:flex;flex-direction:column;gap:6px;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.gl b{color:var(--ink);font-weight:600}
.gl sup{color:var(--die);font-weight:600}
/* wide article: glosses become side notes next to the line where the word is (positioned by layoutGl) */
@container (min-width: 600px){
  .abody.has-gl{padding-right:214px}
  .abody.has-gl .gl{display:contents}
  .abody.has-gl .gl>div{position:absolute;right:0;width:194px;box-sizing:border-box;border-left:2px solid var(--accent);padding-left:10px}
}
.rhint{font-size:13px;color:var(--muted);margin:0}
.mynotes{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.mynotes h3{margin:0;font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.mn{display:flex;flex-direction:column;gap:2px}
.mn .mq{border:0;background:none;padding:0;text-align:left;font-family:var(--read);font-size:15.5px}
.mn .mq span{background:linear-gradient(transparent 52%, color-mix(in srgb,var(--accent) 55%,transparent) 52%)}
.mn p{margin:0;font-size:14px}
.mn .mna{display:flex;gap:14px}
.pop{position:absolute;z-index:30;width:min(340px,calc(100vw - 24px));box-sizing:border-box;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.pop[hidden]{display:none}
.pop-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pop-h .pop-w{font-family:var(--display);font-size:22px;font-weight:600}
.pop-h .art{font-size:15px}
.pop .speak{width:30px;height:30px}
.pop .speak svg{width:16px;height:16px}
.pop-f,.muted{color:var(--muted);font-size:13px}
.pop-m{font-size:15px}
.pop-de{font-family:var(--ui);font-size:13.5px;border-left:2px solid var(--accent);padding-left:10px}
.pop-note{font-size:13.5px;background:var(--bg);border-radius:8px;padding:8px 10px}
.pop-q{font-family:var(--read);font-size:15.5px}
.pop-parts{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.pop-parts b{color:var(--ink)}
.pop-a{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.pop textarea{min-height:72px;background:var(--bg)}
.ok{color:var(--good);font-size:13px;font-weight:600}
.wb-item .d.r{color:var(--der)}
.wb-mini{display:flex;flex-direction:column;gap:8px}
.wb-mini p{margin:0}
.wb-mini .de-gloss{border-left:2px solid var(--accent);padding-left:10px;font-size:14px}
.ctx{font-family:var(--read);font-size:15px;color:var(--muted)}
.qs{display:flex;flex-direction:column;gap:14px}
.q{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.q .qt{font-family:var(--read);font-size:16.5px;font-weight:600}
.q .qn{font-size:12px;color:var(--muted);letter-spacing:.06em}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font-family:var(--read);font-size:15.5px}
.opt input{margin-top:5px}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}

textarea{width:100%;box-sizing:border-box;min-height:84px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);color:var(--ink);font-family:var(--read);font-size:15.5px;resize:vertical}

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const today = () => ymd(new Date());
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const WD = ['周日','周一','周二','周三','周四','周五','周六'];
const fmtDate = s => { const d = parseD(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + WD[d.getDay()]; };
const fmtShort = s => { const d = parseD(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; };
const LEVELS = [['A1','入门'],['A2','初级'],['B1','中级'],['B2','中高级'],['B2–C1','中高级到高级'],['C1','高级']];
const DEFAULT_LEVEL = 'B2–C1';
const SCHEDULE_TIME = '北京时间每天凌晨 2:30 左右';
// spaced review: interval in days for each level; first review depends on the first answer
const LADDER = [1, 2, 4, 7, 15, 30, 60, 120];
const INIT_L = { u: 0, f: 1, k: 3 };
const REV_CAPS = [[20, '20 个'], [40, '40 个'], [60, '60 个'], [100, '100 个'], [0, '不限']];
const REVL = ['记得', '模糊', '忘了'];
const LEVEL_HINT = {
  'B2–C1': '水平介于 B2 和 C1 之间：选 B2 后段到 C1 的词，偏新闻、职场、社会议题和书面表达中常见的词，例如抽象名词、带固定介词的动词、可分动词、书面连接词和副词；不要选 A1–B1 的基础词。',
  'C1': '水平 C1：选高级、书面和学术语境中常用的词，包括固定搭配和较抽象的表达。'
};
const hint = l => LEVEL_HINT[l] ? '\n' + LEVEL_HINT[l] : '';
const emptyProg = () => ({ marks: {}, pos: 0, answers: {}, grading: null, notes: [] });
const S = { db:null, sample:null, uid:null, profileRef:null, settingsRef:null, contentRef:null, dayRef:null, unsub:null,
  settings:{ level: DEFAULT_LEVEL, seen: [], dates: [] }, profile:{ cal: {} },
  date: today(), day:null, content:null, calMonth: today().slice(0, 7),
  view:'words', idx:0, gen:{ words:null, read:null }, err:{}, book:[], bookFilter:'all', openBook:null, showTr:false, showGl:true, readPane:'art', slide:null, wmode:null, ridx:0, ridxDate:null, srs:{}, cards:{}, revBuilding:null, pop:null, lookup:{}, lookingUp:null, bookGen:null,
  cloud:'connecting', justDone:false, confirmRegen:false };

/* ---------------- storage ---------------- */
let wq = Promise.resolve();
function save(ref, patch, full) {
  if (!ref) return;
  // update() rejects when the document does not exist yet (a fresh day): create it instead
  const merge = () => ref.update(patch).catch(async e => { const s = await ref.get().catch(() => null); if (s && !s.exists) return ref.set(patch); throw e; });
  wq = wq.then(() => (full ? ref.set(patch) : merge())).catch(e => { console.warn('save', e); setCloud('warn'); });
  return wq;
}
function setCloud(s) {
  S.cloud = s;
  const map = {connecting:['', '正在载入…','载入中'], ok:['ok','进度保存在这台设备上','本机'], warn:['warn','本机存储不可用，进度只保留在本次打开','未保存']};
  const [c, t, m] = map[s];
  for (const id of ['sync-dot','sync-dot-m']) $('#'+id).className = 'dot ' + c;
  $('#sync-txt').textContent = t; $('#sync-txt-m').textContent = m;
}
/* local cache: the page shows the last known content instantly, then refreshes from the cloud */
const CK = 'deutsch-taeglich-cache-v1';
function cacheRead() { try { return JSON.parse(localStorage.getItem(CK)) || {}; } catch (e) { return {}; } }
let cacheTimer;
function scheduleCache() {
  clearTimeout(cacheTimer);
  cacheTimer = setTimeout(() => {
    try {
      if (!S.day || !S.content) return;
      const c = cacheRead(); c.days = c.days || {};
      c.days[S.day.date] = { content: S.content, prog: { marks: S.day.marks, pos: S.day.pos, answers: S.day.answers, grading: S.day.grading, notes: S.day.notes || [], review: S.day.review, rmarks: S.day.rmarks || {}, rpos: S.day.rpos || 0 } };
      const keep = Object.keys(c.days).sort().slice(-4); for (const k of Object.keys(c.days)) if (!keep.includes(k)) delete c.days[k];
      c.settings = S.settings; c.cal = S.profile.cal;
      localStorage.setItem(CK, JSON.stringify(c));
    } catch (e) {}
  }, 600);
}
function addDate(date, lemmas) {
  const st = S.settings;
  st.seen = Array.from(new Set((st.seen || []).concat(lemmas || []))).slice(-3000);
  st.dates = Array.from(new Set((st.dates || []).concat(date))).sort().slice(-1000);
  save(S.settingsRef, { seen: st.seen, dates: st.dates });
}

async function boot() {
  const cached = cacheRead(), t0 = today();
  if (cached.settings) Object.assign(S.settings, cached.settings);
  if (cached.cal) S.profile.cal = cached.cal;
  const cd = cached.days && cached.days[t0];
  if (cd && cd.content && cd.content.date === t0) {
    S.day = { date: t0, ...emptyProg(), ...(cd.prog || {}) };
    applyContent(cd.content);
    const n = S.day.lemmas.length;
    S.idx = n && Object.keys(S.day.marks).length >= n ? n : Math.min(S.day.pos || 0, Math.max(0, n - 1));
    initRev();
  }
  render();
  const [db, user, sample] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('sample')]).catch(() => [null,null,null]);
  S.sample = sample;
  const uid = user ? await user.id().catch(() => null) : null;
  if (db && uid) {
    S.db = db; S.uid = uid;
    S.profileRef = db.doc('data/users/' + uid + '/profile');
    S.settingsRef = db.doc('settings/main');
    S.contentRef = db.doc('content/' + t0);
    S.dayRef = S.profileRef.collection('days').doc(t0);
    S.prefetch = { date: t0, c: S.contentRef.get().catch(() => null), p: S.dayRef.get().catch(() => null) };
    try {
      const [p, st] = await Promise.all([S.profileRef.get(), S.settingsRef.get()]);
      const pd = p.exists ? clone(p.data()) : null;
      if (pd) S.profile = { cal: {}, ...pd };
      else await S.profileRef.set({ cal: {} });
      if (st.exists) Object.assign(S.settings, clone(st.data()));
      else { S.settings.seen = (pd && pd.seen) || []; await S.settingsRef.set(S.settings); }
      setCloud('ok');
    } catch (e) { setCloud('warn'); }
  } else setCloud('warn');
  await openDate(today(), !!(S.day && S.day.date === today()));
  loadBook();
  render();
  let lastToday = today();
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !S.db) return;
    const t = today();
    try { const st = await S.settingsRef.get(); if (st.exists) Object.assign(S.settings, clone(st.data())); } catch (e) {}
    try { const p = await S.profileRef.get(); if (p.exists) S.profile = { cal: {}, ...clone(p.data()) }; } catch (e) {}
    if (t !== lastToday && S.date === lastToday) { lastToday = t; await openDate(t); }
    else { lastToday = t; await openDate(S.date, true); }
    if (!document.activeElement || document.activeElement.tagName !== 'TEXTAREA') render();
  });
}

const sig = c => c ? [c.createdAt, (c.lemmas || []).join(','), (c.words || []).filter(Boolean).length, c.reading?.title || ''].join('|') : '';
function applyContent(c) {
  S.content = c;
  Object.assign(S.day, { level: c?.level || S.settings.level, lemmas: c?.lemmas || [], words: c?.words || [], reading: c?.reading || null });
}

async function openDate(date, refresh) {
  if (S.unsub && (!refresh || date !== S.date)) { S.unsub(); S.unsub = null; }
  const changed = date !== S.date;
  S.date = date;
  S.contentRef = S.db ? S.db.doc('content/' + date) : null;
  S.dayRef = S.profileRef ? S.profileRef.collection('days').doc(date) : null;
  if (!S.db) { if (!S.day || changed) { S.day = { date, ...emptyProg() }; applyContent(null); S.idx = 0; } return; }
  let c = null, p = null;
  const pf = S.prefetch && S.prefetch.date === date ? S.prefetch : null; S.prefetch = null;
  const [cs, ps] = await Promise.all([pf ? pf.c : S.contentRef.get().catch(() => null), pf ? pf.p : S.dayRef.get().catch(() => null)]);
  if (cs && cs.exists) c = clone(cs.data());
  if (ps && ps.exists) p = clone(ps.data());
  if (S.date !== date) return;
  // earlier versions kept the words inside the private day document: move them to the shared content
  if (p && Array.isArray(p.lemmas) && p.lemmas.length) {
    const started = Object.keys(p.marks || {}).length > 0;
    const legacy = { date, level: p.level || S.settings.level, lemmas: p.lemmas, words: p.words || [], reading: p.reading || null, source: 'page', createdAt: Date.now() };
    if (!c || (started && JSON.stringify(c.lemmas) !== JSON.stringify(p.lemmas))) { c = legacy; save(S.contentRef, legacy, true); addDate(date, legacy.lemmas); }
    else if (!c.reading && p.reading && started) { c.reading = p.reading; save(S.contentRef, { reading: p.reading }); }
    p = started ? { marks: p.marks || {}, pos: p.pos || 0, answers: p.answers || {}, grading: p.grading || null } : emptyProg();
    save(S.dayRef, p, true);
  }
  const keep = refresh && S.day && S.day.date === date && (!c || JSON.stringify(c.lemmas) === JSON.stringify(S.day.lemmas || []) || !(S.day.lemmas || []).length);
  const prog = p ? { ...emptyProg(), ...p } : (keep ? { marks: S.day.marks, pos: S.day.pos, answers: S.day.answers, grading: S.day.grading, notes: S.day.notes || [], review: S.day.review, rmarks: S.day.rmarks, rpos: S.day.rpos } : emptyProg());
  S.day = { date, ...prog };
  applyContent(c);
  const n = S.day.lemmas.length;

/* ---------------- review (spaced repetition) ---------------- */
// data/users/<id>/profile/srs/<date of the words> = { date, items: { <index>: { l, g, L, due, n, x, rd, pL, pX } }, minDue }
// L = level in LADDER, due = next review day, n = reviews done, x = times forgotten; rd/pL/pX remember today's starting point so a changed answer recomputes from it
const srsRef = date => S.profileRef.collection('srs').doc(date);
const minDueOf = doc => Object.values(doc.items || {}).reduce((a, it) => (it.due && (!a || it.due < a) ? it.due : a), null);
const revCap = () => (S.profile.revCap ?? 40);
async function srsDoc(date) {

  return S.srs[date] = S.srs[date] || doc || { date, items: {}, minDue: null };
}
function srsPut(date, i) {

}
async function srsLearn(date, i, m, l, g) {

  const doc = await srsDoc(date), old = doc.items[i];
  if (old && old.n > 0) return; // already in review: the first answer no longer decides the schedule
  const L = INIT_L[m] ?? 0;

  srsPut(date, i);
}
async function srsMigrate() {

  try {
    for (const date of Object.keys(S.profile.cal || {}).sort()) {
      const x = await srsRef(date).get(); if (x.exists) { S.srs[date] = clone(x.data()); continue; }
      const [ps, cs] = await Promise.all([S.profileRef.collection('days').doc(date).get(), S.db.doc('content/' + date).get()]);
      const marks = ps.exists ? (ps.data().marks || {}) : {}, c = cs.exists ? cs.data() : null;
      if (!c || !Object.keys(marks).length) continue;
      const doc = { date, items: {}, minDue: null };
      Object.entries(marks).forEach(([i, m]) => { const L = INIT_L[m] ?? 0; doc.items[i] = { l: (c.lemmas || [])[i] || '', g: artCls(c.words?.[i]?.gender) || null, L, due: addDays(date, LADDER[L]), n: 0, x: 0 }; });

}
async function buildReview() {
  // today's review list is fixed once per day: due words, oldest first, up to the daily cap
  const t = today();
  if (!S.profileRef || S.date !== t || !S.day || Array.isArray(S.day.review)) return;
  if (S.revBuilding) return S.revBuilding;
  S.revBuilding = (async () => {
    await srsMigrate();
    let due = [];
    try {
      const q = await S.profileRef.collection('srs').where('minDue', '<=', t).get();
      q.docs.forEach(x => {
        const doc = clone(x.data()); if (!doc.date || doc.date >= t) return;
        S.srs[doc.date] = doc;
        Object.entries(doc.items || {}).forEach(([i, it]) => { if (it.due && it.due <= t) due.push({ d: doc.date, i: Number(i), l: it.l, g: it.g || null, due: it.due, L: it.L || 0 }); });
      });
    } catch (e) { return; }
    due.sort((a, b) => (a.due > b.due) - (a.due < b.due) || a.L - b.L || (a.d > b.d) - (a.d < b.d) || a.i - b.i);

    S.day.review = due.map(({ d, i, l, g }) => ({ d, i, l, g }));
    S.day.rmarks = {}; S.day.rpos = 0;
    save(S.dayRef, { review: S.day.review, rmarks: {}, rpos: 0 });

}

const wmode = () => ((S.day && S.day.review || []).length && S.wmode === 'rev' ? 'rev' : 'new');

async function rmark(j, m) {

    const first = it.rd !== t, base = first ? (it.L || 0) : (it.pL ?? it.L ?? 0), bx = first ? (it.x || 0) : (it.pX ?? it.x ?? 0);

function rgo(j) {

}

/* ---------------- check-in ---------------- */
function dayStatus(d) {
  const R = d.review || [], nl = d.lemmas.length;
  const t = nl + R.length, n = Math.min(Object.keys(d.marks || {}).length, nl) + Math.min(Object.keys(d.rmarks || {}).length, R.length), r = !!(d.grading && !d.grading.pending);
  return { n, t, r, done: nl > 0 && n >= t && r };
}
function syncCal() {
  const d = S.day; if (!d || !d.lemmas.length) return;
  const st = dayStatus(d), old = (S.profile.cal || {})[d.date];
  st.done = st.done || !!(old && old.done);
  if (old && old.n === st.n && old.t === st.t && old.r === st.r && old.done === st.done) return;
  if (st.done && !(old && old.done)) S.justDone = true;
  S.profile.cal = { ...(S.profile.cal || {}), [d.date]: st };
  save(S.profileRef, { cal: { [d.date]: st } });
}
function streak() {
  const cal = S.profile.cal || {};
  let d = today(), k = 0;
  if (!(cal[d] && cal[d].done)) d = addDays(d, -1);
  while (cal[d] && cal[d].done) { k++; d = addDays(d, -1); }

}
const isDone = date => !!((S.profile.cal || {})[date] && S.profile.cal[date].done);

  if (c === 'session_expired') return '登录已过期，请重新登录 claude.ai 后刷新。';
  return '生成失败（' + (c || '未知错误') + '），点“重试”再试一次。';

function speak(text) {

  } catch (e) {}
}

  save(S.dayRef, { marks: { [i]: m }, pos: i });
  const w = d.words[i], key = bookKey(d.lemmas[i]) || ('w' + i);
  srsLearn(d.date, i, m, d.lemmas[i], artCls(w?.gender));
  if (S.profileRef && w) {
    const ref = S.profileRef.collection('wordbook').doc(key);
    if (m === 'k') { if ((S.book.find(b => b.id === key) || {}).mark !== 'r') { wq = wq.then(() => ref.delete()).catch(() => {}); S.book = S.book.filter(b => b.id !== key); } }
    else {
      const entry = { word: w, mark: m, date: d.date, added: Date.now() };

}

function layoutGl() {

  if (!items.length || getComputedStyle(items[0]).position !== 'absolute') { body.style.minHeight = ''; return; }
  const top0 = body.getBoundingClientRect().top; let floor = 0;
  items.forEach(it => {
    const tk = body.querySelector(`.tk[data-p="${it.dataset.p}"][data-k="${it.dataset.k}"]`);
    const top = Math.max(tk ? tk.getBoundingClientRect().top - top0 - 1 : floor, floor);

  const R = d.review || [], rleft = R.length - Object.keys(d.rmarks || {}).length;
  const need = [rleft > 0 ? '复习' : '', graded ? '' : '阅读题'].filter(Boolean).join('和');
  const btns = (rleft > 0 ? `<button class="btn primary" data-wmode="rev">开始复习（${rleft} 个）</button>` : '') + (graded ? '' : `<button class="btn ${rleft > 0 ? '' : 'primary'}" data-view-go="read">去做${esc(dayName())}阅读</button>`);
  return `<div class="view">${dateBar()}
    <div class="head"><div><h1>${left ? '还有 ' + left + ' 个词没选' : esc(dayName()) + '的新词完成了'}</h1>${!left && need ? `<p class="sub">再做完${need}就能打卡。</p>` : ''}</div>${btns ? `<div style="display:flex;gap:8px;flex-wrap:wrap">${btns}</div>` : ''}</div>${wseg()}
    ${progBar()}
    <div class="summary"><div class="stat k"><b>${c.k.length}</b>认识</div><div class="stat f"><b>${c.f.length}</b>模糊</div><div class="stat u"><b>${c.u.length}</b>不认识</div></div>

    ${c.k.length ? `<section class="sec"><h3>认识的词</h3><div class="wlist">${pills(c.k)}</div></section>` : ''}
    <div><button class="btn" data-go="0">从头再看一遍</button></div>
  </div>`;
}

  }).join('');
  let scoreLine = '', got = 0, tot = 0;
  const nq = r.questions.length, na = r.questions.filter((q, i) => String(d.answers[i] ?? '').trim()).length;

/* ---------------- reading: words, highlights, notes ---------------- */
const WRE = /[A-Za-zÀ-ÖØ-öø-ÿß]+(?:-[A-Za-zÀ-ÖØ-öø-ÿß]+)*/g;
function paraSegs(de) {
  const segs = []; let k = 0, inT = false;
  String(de || '').split(/(\[\[|\]\])/).forEach(part => {
    if (part === '[[') { inT = true; return; }
    if (part === ']]') { inT = false; return; }
    let last = 0;
    part.replace(WRE, (m, off) => {
      if (off > last) segs.push({ t: part.slice(last, off), k: -1 });
      segs.push({ t: m, k: k++, tw: inT }); last = off + m.length; return m;
    });
    if (last < part.length) segs.push({ t: part.slice(last), k: -1 });
  });
  return segs;
}
let segR = null, segL = [];
function segsOf(p) {
  const r = S.day && S.day.reading;
  if (r !== segR) { segR = r; segL = r ? r.paragraphs.map(x => paraSegs(x.de)) : []; }
  return segL[p] || [];
}
function rangeText(p, a, b) {
  const segs = segsOf(p);
  const i = segs.findIndex(s => s.k === a), j = segs.findIndex(s => s.k === b);
  return i < 0 || j < 0 ? '' : segs.slice(i, j + 1).map(s => s.t).join('');
}
function sentenceAt(p, k) {
  const segs = segsOf(p), txt = segs.map(s => s.t).join('');
  let off = 0; for (const s of segs) { if (s.k === k) break; off += s.t.length; }
  const re = /[^.!?]+[.!?]*["“”»«]*\s*/g; let m;
  while ((m = re.exec(txt))) if (m.index + m[0].length > off) return m[0].trim();
  return txt.trim();
}
function glossFor(tok) {
  const g = S.day && S.day.reading && S.day.reading.gloss, k = String(tok).toLowerCase();
  return (g && (g[k] || g[tok])) || S.lookup[k] || null;
}
function glossIndex(r) {
  const list = [], byK = {};
  (r && r.glossDe || []).forEach(x => {
    const s = segsOf(x.p).find(s => s.k >= 0 && s.t.toLowerCase() === String(x.w).toLowerCase());
    if (s && !byK[x.p + ':' + s.k]) { const e = { ...x, k: s.k }; list.push(e); byK[x.p + ':' + s.k] = e; }
  });
  list.sort((a, b) => a.p - b.p || a.k - b.k).forEach((e, i) => e.no = i + 1);
  return { list, byK };
}
function paraHTML(p, gdx) {
  const notes = (S.day.notes || []).filter(n => n.p === p);
  const inNote = k => notes.find(n => k >= n.a && k <= n.b);
  let html = '', prevK = -1;
  segsOf(p).forEach(s => {
    if (s.k >= 0) {
      const n = inNote(s.k), g = S.showGl && gdx.byK[p + ':' + s.k];
      html += `<span class="tk${s.tw ? ' tw' : ''}${n ? ' hl' : ''}" data-p="${p}" data-k="${s.k}">${esc(s.t)}</span>`;
      if (g) html += `<sup class="gn">${g.no}</sup>`;
      if (n && n.n && n.b === s.k) html += `<sup class="nt" data-note="${esc(n.id)}" title="${esc(n.n)}">✎</sup>`;
      prevK = s.k;
    } else html += prevK >= 0 && notes.some(n => n.a <= prevK && n.b >= prevK + 1) ? `<span class="hl">${esc(s.t)}</span>` : esc(s.t);
  });
  return html;
}
function saveNotes() { save(S.dayRef, { notes: S.day.notes || [] }); }
function noteAt(p, a, b) { return (S.day.notes || []).find(n => n.p === p && n.a <= a && n.b >= b); }
function upsertNote(p, a, b) {
  const d = S.day, ns = d.notes || [];
  const ov = ns.filter(n => n.p === p && !(n.b < a || n.a > b));
  if (ov.length === 1 && ov[0].a <= a && ov[0].b >= b) return ov[0];
  const n = { id: ov[0] ? ov[0].id : 'n' + Date.now().toString(36), p, a: Math.min(a, ...ov.map(x => x.a)), b: Math.max(b, ...ov.map(x => x.b)), n: ov.map(x => x.n).filter(Boolean).join('；') };
  d.notes = ns.filter(x => !ov.includes(x)).concat(n); saveNotes();
  return n;
}
function resolveP(P) {
  const single = P.a === P.b, tok = rangeText(P.p, P.a, P.b), g = single ? glossFor(tok) : null;
  const lemma = g && g.l && !/ \/ /.test(g.l) ? g.l : tok;
  return { single, tok, g, lemma, li: S.day.lemmas.indexOf(lemma), gde: single ? glossIndex(S.day.reading).byK[P.p + ':' + P.a] : null, key: bookKey(lemma).slice(0, 120) };
}
function addFromReading(P) {
